<title>The Packet on Its Way</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">
<style>
:root{color-scheme:dark;--bg0:#0e0e10;--bg1:#161618;--bg2:#1c1c1f;--bg3:#26262a;--ink:#f0eee7;--ink2:#b7b5aa;--mute:#83817a;--line:rgba(255,255,255,.08);--accent:#e2b04a;--live:#4ade80;--alarm:#e05a6a;--r:10px;--ease:cubic-bezier(.25,.1,.25,1)}

h2{font-weight:500;letter-spacing:-.02em;font-size:18px;margin:0}
.nav{background:var(--bg1);border-bottom:1px solid var(--line);font-size:14px;letter-spacing:.03em;text-transform:lowercase;display:flex;gap:22px;padding:12px 28px;color:var(--ink2)}

.page{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}

.stat{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.hair{border-top:1px solid var(--line)}

.g2:last-child{border-bottom:0}
.g3{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);align-items:baseline}
.g3:last-child{border-bottom:0}
.right{text-align:right}

.plate:before{top:-1px;left:-1px;border-width:1px 0 0 1px}

.law:last-child{border-bottom:0}
.law .poles{display:flex;justify-content:space-between}
.law .poles span{font-size:11.5px;letter-spacing:.04em;color:var(--mute);text-transform:lowercase}
.law .name{display:flex;justify-content:space-between;align-items:baseline}
.law .name b{font-weight:500;font-size:14px}
.law .name span{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em}
input[type=range]{width:100%;margin:4px 0 0;appearance:none;background:transparent;height:14px}

.btn{font-family:inherit;font-size:12.5px;letter-spacing:.04em;text-transform:lowercase;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:rgba(255,255,255,.22)}

.tip .d{display:block}
.scrub{position:relative;height:14px;flex:1}
.scrub input{position:absolute;inset:0;margin:0}
.scrub .mk{position:absolute;top:-4px;width:1px;height:22px;background:rgba(255,255,255,.22);pointer-events:none}
.scrub .mk i{position:absolute;top:22px;left:0;transform:translateX(-50%);font-style:normal;font-size:11px;letter-spacing:.04em;color:var(--mute);white-space:nowrap;text-transform:lowercase}
.scrub .mk:nth-child(even) i{top:36px}
.att{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}

.line.hit{background:rgba(226,176,74,.16)}
.line.fold{color:var(--mute);font-size:12.5px}
.ask{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}

.opt.on{border-color:var(--accent);color:var(--ink);background:rgba(226,176,74,.12)}
button.opt{cursor:pointer;font-family:inherit;background:transparent}
button.opt:hover{border-color:rgba(255,255,255,.3);color:var(--ink)}
.unit[data-unit]{cursor:pointer;border-bottom:1px dotted rgba(226,176,74,.5)}
.unit[data-unit]:hover{color:var(--ink);border-bottom-color:var(--ink)}
.line.flash{background:rgba(74,222,128,.22)}
.rh{cursor:pointer}
.att.folded>*:not(.rh){display:none!important}
#lightbox:not([hidden]){display:flex}
.toast{position:fixed;right:22px;bottom:22px;background:var(--bg2);border:1px solid var(--accent);color:var(--ink);padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.on{opacity:1}
textarea.say{width:100%;min-height:64px;background:var(--bg1);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-family:inherit;font-size:13.5px;padding:8px;resize:vertical}

.bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const DATA=__DATA__;const VIEWS=__VIEWS__;const IMGS=__IMGS__;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,fmt=(v,d=2)=>Number(v).toFixed(d),pad2=n=>String(n).padStart(2,'0');
function ago(s){s=Math.max(0,Math.floor(s));if(s<60)return s+' s';if(s<3600)return Math.floor(s/60)+' m '+pad2(s%60)+' s';if(s<86400)return Math.floor(s/3600)+' h '+pad2(Math.floor(s%3600/60))+' m';return Math.floor(s/86400)+' d '+pad2(Math.floor(s%86400/3600))+' h'}
let LOGMAX=Math.log10(10*86400);const logp=s=>Math.min(1,Math.max(0,Math.log10(1+Math.max(0,s)))/LOGMAX);
function ceilingFor(scale){return Math.log10(1+60*Math.pow(14400,scale))}
function scaleT(sec,curve){const ceil=Math.pow(10,LOGMAX)-1;const g=lerp(.08,1,curve);const pw=Math.pow(Math.min(1,Math.max(0,sec)/ceil),g);return curve<=0?logp(sec):lerp(logp(sec),pw,Math.min(1,curve*1.6))}
const ACC={brass:'#e2b04a',lime:'#b4f42f',cyan:'#5fc8d8'};
const LIVE='#4ade80',ALARM='#e05a6a';
const MODEL=new Set([2,3,4,5]);
const STATION_HUES=['#9085e9','#d95926','#199e70','#c98500','#d55181','#3987e5','#e66767'];
const t0=new Date(DATA.t0);const clockText=t=>{const d=new Date(t0.getTime()+t*1000);return pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes())+':'+pad2(d.getUTCSeconds())};

// ---------- state, every field in the url
const LAWS=[
  {key:'tilt',poles:['flat','standing'],label:'tilt',def:.45},
  {key:'scale',poles:['a minute','ten days'],label:'scale',def:1},
  {key:'history',poles:['none','an hour of ghosts'],label:'wake',def:0},
  {key:'weight',poles:['even','by ink'],label:'weight',def:0},
  {key:'heat',poles:['one hue','hotter each round'],label:'rounds',def:0},
  {key:'spot',poles:['everyone','the one under the cursor'],label:'focus',def:0},
];
const LOCKED={rose:{tilt:.5,scale:1,history:0,weight:1,heat:1,spot:1},rail:{tilt:.75,scale:1,history:0,weight:1,heat:1,spot:1},nest:{tilt:0,scale:1,history:0,weight:0,heat:0,spot:1}};
const LOCKED_LAY={rose:{gap:0,hub:0,taper:1,stack:0,curve:.4,ticks:.5,rings:.5,spokes:1},rail:{tail:.5,spacing:.3,reach:.4,lift:1,grain:1},nest:{size:1,fill:1,spread:0,anchor:.25,curve:0}};
const law=k=>(LOCKED[S.layout]&&k in LOCKED[S.layout])?LOCKED[S.layout][k]:S.laws[k];
const LAYOUTS=['rose','rail'];const LAYOUT_NAMES={rose:'rose',rail:'field',nest:'nest'};
const LAYOUT_LAWS={
  rose:[{key:'gap',poles:['tight','airy'],label:'gap',def:.4,lo:.02,hi:.32},{key:'hub',poles:['small','wide'],label:'hub',def:.3,lo:.4,hi:3.2},{key:'taper',poles:['bar','wedge'],label:'taper',def:1,lo:0,hi:1},{key:'stack',poles:['side by side','stacked'],label:'stack',def:0,lo:0,hi:1},
    {key:'curve',poles:['log','linear'],label:'curve',def:0,lo:0,hi:1},{key:'rings',poles:['none','dense'],label:'rings',def:.5,lo:0,hi:8},{key:'ticks',poles:['none','fine'],label:'ticks',def:.5,lo:0,hi:168},{key:'spokes',poles:['hidden','drawn'],label:'spokes',def:.3,lo:0,hi:.4}],
  rail:[{key:'spacing',poles:['close','far'],label:'spacing',def:.5,lo:1.8,hi:3.4},{key:'reach',poles:['peaks','plains'],label:'reach',def:.45,lo:.6,hi:2.4},{key:'lift',poles:['low','tall'],label:'lift',def:.5,lo:.6,hi:3.2},{key:'grain',poles:['still water','wind'],label:'grain',def:.35,lo:0,hi:1},{key:'tail',poles:['short','long'],label:'tail',def:.5,lo:4,hi:40}],
  nest:[{key:'size',poles:['small','large'],label:'size',def:.4,lo:.9,hi:3.4},{key:'anchor',poles:['0','2π'],label:'anchor · rad',def:.25,lo:0,hi:Math.PI*2},{key:'fill',poles:['hollow','solid'],label:'fill',def:.6,lo:0,hi:.55},{key:'spread',poles:['one nest','by station'],label:'spread',def:0,lo:0,hi:2.4},{key:'curve',poles:['log','linear'],label:'curve',def:.35,lo:0,hi:1},
    {key:'edge',poles:['hairline','heavy'],label:'edge',def:.4,lo:.2,hi:1},{key:'tint',poles:['by station','one accent'],label:'tint',def:0,lo:0,hi:1},{key:'orbit',poles:['fixed','walking'],label:'orbit',def:0,lo:0,hi:1},{key:'breath',poles:['still','swelling'],label:'breath',def:.4,lo:0,hi:.18},{key:'petals',poles:['three','twelve'],label:'petals',def:.3,lo:3,hi:12},{key:'scallop',poles:['round','cut'],label:'scallop',def:.45,lo:0,hi:.22}],
};
const lv=(lay,key)=>{const l=LAYOUT_LAWS[lay].find(x=>x.key===key);const v=(key in LOCKED_LAY[lay])?LOCKED_LAY[lay][key]:S.lay[lay][key];return l.lo+(l.hi-l.lo)*v};
const LOCK={distance:0,glow:1,motion:.7,names:0};
const S={laws:{},lay:{rose:{},rail:{},nest:{}},layout:'rose',accent:'brass',t:0,sel:null,playing:false,speed:20,answers:{},open:{},trailAll:false,say:null};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600)}
async function copyCmd(cmd){try{await navigator.clipboard.writeText(cmd);toast('copied · '+cmd)}catch{toast(cmd)}}const SPEEDS=[1,5,20,60];
(function init(){const q=new URLSearchParams(location.search);for(const l of LAWS)S.laws[l.key]=clamp(parseFloat(q.get(l.key)??l.def),0,1);for(const lay of LAYOUTS)for(const l of LAYOUT_LAWS[lay])S.lay[lay][l.key]=clamp(parseFloat(q.get(lay+'_'+l.key)??l.def),0,1);S.layout=LAYOUTS.includes(q.get('layout'))?q.get('layout'):'rose';S.accent=ACC[q.get('accent')]?q.get('accent'):'brass';S.t=clamp(parseInt(q.get('t')??DATA.instants[0][1])||0,0,DATA.seconds);S.sel=q.get('sel')?parseInt(q.get('sel')):534;S.speed=SPEEDS.includes(+q.get('speed'))?+q.get('speed'):20})();
function writeURL(){const q=new URLSearchParams();q.set('t',S.t);if(S.sel!=null)q.set('sel',S.sel);history.replaceState(null,'',location.pathname+'?'+q);$('#urlLine').textContent='/packet?'+q.toString().replace(/&/g,' · ')}
const acc=()=>ACC[S.accent];

applyAccent();
function applyAccent(){document.documentElement.style.setProperty('--accent',acc());document.querySelectorAll('#palettes button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===S.accent)))}

// ---------- the instant, from the url; no clock on this page
function setPlaying(){}

// ---------- model
function stateAt(item,t){let cur=null;for(const tr of item.trans){if(tr[0]<=t)cur=tr;else break}if(!cur||cur[1]<0)return null;return{st:cur[1],note:cur[2],since:t-cur[3]}}
function callsAt(item,t){let n=0,ink=0;for(const r of item.trail){if(r[1]<=t&&r[5]){n++;ink+=r[6]}}return{n,ink}}
const INK_MEAN=(()=>{const v=DATA.items.map(it=>it.trail.filter(r=>r[5]).reduce((a,r)=>a+r[6],0)).filter(x=>x>0);return v.length?v.reduce((a,b)=>a+b,0)/v.length:1})();

  // asks and connections

  $('#pAsks').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline"><h2>asks</h2><span class="d m">${plain.length?plain.length+' raised':'none raised'}</span></div>`+plain.map(k=>{const real=k.answer&&k.answer.t<=S.t?k.answer:null;const local=S.answers[k.id];const ans=real||local;const open=!ans;return`<div class="ask${open?' open':''}" data-ask="${k.id}" style="${open?'border-color:var(--accent)':''}"><div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:14.5px">${esc(k.kind)}${open?' <span class="d" style="color:var(--accent)">open</span>':''}</span><span class="d m">${k.at}${k.attempt?' · attempt '+k.attempt:''}</span></div>${k.why?`<div style="font-size:13px;color:var(--ink2);line-height:1.35">${esc(k.why)}</div>`:''}<div>${k.options.map((o,i)=>open?`<button class="opt" data-choice="${esc(o)}" data-ask="${k.id}">${i<4?'<span class="key" style="margin-right:5px">'+(i+1)+'</span>':''}${esc(o)}</button>`:`<span class="opt${ans&&ans.choice===o?' on':''}">${esc(o)}</span>`).join('')}</div>${open&&S.say===k.id?`<textarea class="say" data-ask="${k.id}" placeholder="what is wrong, in your words · enter to send, esc to cancel"></textarea>`:''}<div class="d m">${real?`answered ${real.at} · ${esc(real.choice)}${real.text?' · “'+esc(real.text.slice(0,80))+'”':''}`:local?`answered here · ${esc(local.choice)}${local.text?' · “'+esc(local.text.slice(0,80))+'”':''} · <span style="color:var(--accent)">ytk ask answer ${k.id} ${esc(local.choice)}${local.text?' --text "…"':''}</span>`:'waiting for the owner · pick an option, or press its number'}</div></div>`}).join('');
  $('#pLinks').innerHTML=links.length?`<div style="display:flex;justify-content:space-between;align-items:baseline"><h2>connections</h2><span class="d m">the librarian argued ${links.reduce((n,k)=>n+k.links.length,0)}</span></div>`+links.map(k=>{const ans=k.answer&&k.answer.t<=S.t?k.answer:null;return`<div class="ask"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="d">${k.at}</span><span class="d m">${ans?'answered '+ans.at+' · '+esc(ans.choice):'open'}</span></div>${k.links.map(l=>`<div class="g2" title="${esc(l.why)}"><span class="d" style="color:${ans&&ans.choice==='approve'?'var(--ink)':'var(--ink2)'}">${esc(l.title)}</span><span class="d m right">${ans&&ans.choice==='approve'?'approved':ans?esc(ans.choice):'argued'}</span></div>`).join('')}</div>`}).join(''):'';
  // trail
  const rows=it.trail.filter(r=>r[1]<=S.t);const shown=S.trailAll?rows:rows.slice(-8);$('#pTrailN').innerHTML=`register · ${rows.length} hand-offs${rows.length>8?` · <span class="unit" data-trail="1">${S.trailAll?'last eight':'show all'}</span>`:''}`;$('#pTrail').innerHTML=shown.map(r=>`<div class="g3"><span class="d m${r[4]?' alarm':''}">${r[0]}</span><span class="d${r[4]?' alarm':''}">${esc(r[2])}</span><span class="d m right">${esc(r[3])}</span></div>`).join('')+(s&&s.st===2?`<div class="g3"><span class="d live">${clockText(S.t)}</span><span class="d live">student · ${esc(s.note)}</span><span class="d live right">writing</span></div>`:'');
  $('#pActions').innerHTML=[['view',`ytk view ${it.id}${rounds?' --attempt '+rounds:''} --full`],['grade again',`ytk grade ${it.id}${rounds?' --attempt '+rounds:''}`],['item',`ytk item ${it.id}`]].map(([l,c])=>`<button class="btn" data-cmd="${esc(c)}" title="${esc(c)}">${l}</button>`).join('');
  $('#pAttempt').textContent=rounds||'';$('#pFoot').textContent=rounds?`attempt · at the ${s?DATA.stations[s.st]:'shelf'}`:(s?`at the ${DATA.stations[s.st]}`:'filed');$('#pFoot2').textContent=s?`${s.note} · ${ago(s.since)}`:'';$('#pUrl').textContent=`/packet/${it.id}?at=${clockText(S.t)}z`}

// ---------- keys
wrap.addEventListener('click',e=>{const u=e.target.closest('[data-unit]');if(u){goUnit(u.dataset.unit);return}
  const rh=e.target.closest('.rh');if(rh){const n=rh.parentElement.dataset.round;const it=DATA.items.find(i=>i.id===S.sel);const k=it.id+':'+n;S.open[k]=!S.open[k];renderPanel(true);return}
  const o=e.target.closest('button.opt');if(o){answer(+o.dataset.ask,o.dataset.choice);return}
  const tr=e.target.closest('[data-trail]');if(tr){S.trailAll=!S.trailAll;renderPanel(true);return}
  const c=e.target.closest('[data-cmd]');if(c){copyCmd(c.dataset.cmd);return}
  const img=e.target.closest('#pPacket img');if(img){openFrame(img.alt,img.src)}});
wrap.addEventListener('keydown',e=>{const ta=e.target.closest('textarea.say');if(!ta)return;if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const id=+ta.dataset.ask;S.answers[id]={choice:'say what is wrong',text:ta.value.trim()};S.say=null;renderPanel(true);toast(`ytk ask answer ${id} "say what is wrong" --text "…"`)}if(e.key==='Escape'){e.stopPropagation();S.say=null;renderPanel(true)}});
function answer(id,choice){if(choice==='say what is wrong'){S.say=id;renderPanel(true);setTimeout(()=>{const ta=wrap.querySelector('textarea.say');if(ta)ta.focus()},0);return}S.answers[id]={choice};renderPanel(true);toast(`ytk ask answer ${id} ${choice}`)}
function goUnit(u){if(u.startsWith('frame:')){const n=+u.slice(6);const src=IMGS['frame-'+String(n).padStart(3,'0')+'.jpg'];if(src&&S.sel===534)openFrame(u,src);else toast(u+' · not embedded in this mockup');return}
  const sec=+u.slice(2).split('-')[0];const lines=[...wrap.querySelectorAll('.line:not(.fold)')];if(!lines.length){toast(u+' · no transcript in this packet');return}let best=null,bd=1e9;for(const l of lines){const d=Math.abs(+l.querySelector('.s').textContent-sec);if(d<bd){bd=d;best=l}}if(best){best.scrollIntoView({block:'center',behavior:'smooth'});best.classList.add('flash');setTimeout(()=>best.classList.remove('flash'),1400)}}
function openFrame(cap,src){$('#lbImg').src=src;$('#lbCap').textContent=cap+' · packet '+(VIEWS[S.sel]?VIEWS[S.sel].hash:'');$('#lightbox').hidden=false}
$('#lightbox').addEventListener('click',()=>{$('#lightbox').hidden=true});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;if(!$('#lightbox').hidden){if(e.key==='Escape')$('#lightbox').hidden=true;return}if(e.key==='j'||e.key==='J')walk(1);if(e.key==='k'||e.key==='K')walk(-1);if(e.key==='Escape'){S.sel=null;writeURL();renderPanel(true)}
  if(/^[1-4]$/.test(e.key)&&S.sel!=null){const it=DATA.items.find(i=>i.id===S.sel);const open=it.asks.filter(k=>k.kind!=='connections'&&k.t<=S.t&&!(k.answer&&k.answer.t<=S.t)&&!S.answers[k.id]);if(open.length){const k=open[0];const o=k.options[+e.key-1];if(o)answer(k.id,o)}}});

// ---------- sparkline and ink readout
function inkAt(t){let ink=DATA.inkBefore;const hours=DATA.inkHours.slice();for(const[tt,v]of DATA.ink){if(tt<=t){ink+=v;const h=new Date(t0.getTime()+tt*1000).getUTCHours();hours[h]+=v}}return{ink,hours}}
let sparkKey=-1;function drawSpark(t){const m=Math.floor(t/60);if(m===sparkKey)return;sparkKey=m;const{ink,hours}=inkAt(t);$('#inkToday').textContent=ink.toLocaleString();const mx=Math.max(1,...hours);const cur=new Date(t0.getTime()+t*1000).getUTCHours();$('#spark').innerHTML=hours.map((v,h)=>v?`<rect x="${h*7}" y="${(28-v/mx*26).toFixed(1)}" width="5" height="${(v/mx*26).toFixed(1)}" rx="1" fill="${h===cur?LIVE:'var(--accent)'}" fill-opacity=".85"></rect>`:'').join('')+`<line x1="0" y1="27.5" x2="168" y2="27.5" stroke="rgba(255,255,255,.08)"></line>`}

// ---------- loop
let last=performance.now(),fpsAcc=0,fpsN=0,acc_t=0,urlT=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
writeURL();renderPanel(true);
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;

  const r=draw(dt,0);marksBy.rose=r.marks;const r2=draw(dt,1);marksBy.rail=r2.marks;lastMarks=r.marks;
  drawSpark(S.t);renderPanel(false);
  $('#rtr').textContent=`${clockText(S.t)}z`;$('#rbl').textContent=`${r.marks.length} packets · ${r.held} held by a model · ${r.wait} waiting · ${r.ask} with the owner`;
  fpsAcc+=dt;fpsN++;if(fpsAcc>.5){$('#rbr').textContent=`${Math.round(fpsN/fpsAcc)} fps`;fpsAcc=0;fpsN=0}
  requestAnimationFrame(frame)}
requestAnimationFrame(frame);addEventListener('resize',size);
window.__packet={S,DATA,stateAt,renderer};
</script>
