[project]
name = "ytk"
version = "0.1.0"
description = "Personal YouTube knowledge system"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "yt-dlp>=2024.1.1",
    "youtube-transcript-api>=0.6.2",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "claude-agent-sdk>=0.1.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "chromadb==1.5.9",
    "sentence-transformers>=3.0",
    "mcp>=1.0",
    "trafilatura>=1.6",
    "faster-whisper>=1.0",
    "networkx>=3.0",
    "instaloader>=4.10",
    "instagrapi>=2.1",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "scikit-learn>=1.8.0",
    "numpy>=1.26.4",
    "playwright>=1.49",
]

[project.optional-dependencies]
graph = ["graspologic"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "umap-learn>=0.5.12",
    "ruff>=0.14",
    "pyright>=1.1.400",
]
# Reactive notebooks for tuning shader constants against a real captured frame
# before writing GLSL (labs/). Separate from dev so CI never pulls it.
lab = ["marimo>=0.10", "matplotlib>=3.9", "numpy>=1.26", "pillow>=10.0"]

[project.scripts]
ytk = "ytk.cli:cli"
ytk-mcp = "ytk.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the built React SPA inside the package so `ytk ui` serves /app from an
# installed copy. web/dist is committed (see web/.gitignore) and mapped into the
# wheel at ytk/ui/webdist, where server.py's _WEB_DIST looks for it.
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "ytk/ui/webdist"

[tool.ruff]
line-length = 100
# Pinned to the interpreter this project is developed and run on, which is
# ahead of the requires-python floor (3.12, set by ytk/sdk.py's PEP 695
# type-parameter syntax). Ruff will therefore suggest idioms newer than the
# floor guarantees; anything it proposes must still parse on 3.12.
target-version = "py313"

[tool.ruff.lint]
# Core correctness and modernization rules plus focused comprehension,
# performance, logging, and non-cryptographic-hash checks.
select = [
    "E", "F", "I", "UP", "B", "SIM", "RUF",
    "C4", "PIE", "RET", "PERF", "FURB", "LOG", "G",
    "S324",
]
# Each ignored rule is structurally wrong for this codebase or requires a
# separate behavior-changing review.
ignore = [
    "E501", # the formatter owns line length

    "RUF001", # typographic punctuation in prose strings is deliberate
    "RUF012", # ClassVar annotations add noise to Pydantic and dataclass config
    "PERF401", # guarded loops are clearer than equivalent dense comprehensions
    "B905",   # strict zip changes mismatch behavior
    "B904",   # exception chaining changes traceback behavior
    "SIM105", # suppress changes exception-handling semantics
    "SIM115", # context managers move file-close timing
    "B023",   # closure capture changes require dedicated behavioral tests
    "B007",   # loop names match the surrounding algorithm
    "B008",   # call-in-default is load-bearing for lazy CLI config
    "B017",   # the test deliberately accepts any boundary exception
    "E731",   # assigned lambda used as a compact local callable
    "E741",   # l/I names match referenced numerical notation
    "RUF005", # 2
    "RUF015", # 4
    "RUF043", # 1
    "RUF059", # tuple shapes remain visible at unpack sites
    "SIM108", # 2
    "SIM110", # 1
    "SIM113", # 1
    "UP047",  # existing generics remain compatible with the package floor
]

# Annotation lint is omitted because Pyright owns the strictness ratchet.
# Broad security, import-placement, exception-style, docstring, and complexity
# families need path-specific or behavior-changing decisions rather than a
# blanket style mandate.

[tool.ruff.lint.per-file-ignores]
# Test and script safety exceptions stay narrow so production remains checked.
"tests/**" = [
    "S101", # asserting is what a test does
    "S108", # /tmp paths in fixtures are fixtures, not deployments
]
"tests/test_transcript.py" = [
    "E402", # legacy test sections keep their imports beside the covered feature
]
"scripts/**" = [
    "E402", # scripts must set paths or load environment before project imports
    "S101", # one-off analysis scripts assert their own preconditions
    "S108",
]
"ytk/cli.py" = [
    "E402", # CLI initialization configures process state before later imports
]
"ytk/store.py" = [
    "E402", # environment guards must run before importing model and Chroma clients
]
"ytk/ui/server.py" = [
    "E402", # application and static paths are initialized before route imports
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
# Strict is the default. The list of files carrying `# pyright: basic` can only
# shrink.
# Per-file basic headers isolate legacy annotation and third-party-stub debt.
# Promotion runs leaves-first because strict modules inherit unknown types from
# basic dependencies. Cross-module private API usage is resolved before
# promoting modules that depend on it.
include = ["ytk"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
# eval marks live retrieval-gate runs (loads the encoder, hits the real
# chroma store); the fast suite skips them. Run explicitly: pytest -m eval
# The timeout exposes stray browsers, unstubbed network pulls, and other blocked
# calls. The signal method can interrupt blocking C extensions.
addopts = "-m 'not eval' --timeout=60 --timeout-method=signal"
markers = [
    "eval: live retrieval regression gate (real store + encoder)",
]
