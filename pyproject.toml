[project]
name = "ytk"
version = "0.1.0"
description = "Personal YouTube knowledge system"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "yt-dlp>=2024.1.1",
    "youtube-transcript-api>=0.6.2",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "claude-agent-sdk>=0.1.0",
    "pyyaml>=6.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "mcp>=1.0",
    "trafilatura>=1.6",
    "faster-whisper>=1.0",
    "networkx>=3.0",
    "instaloader>=4.10",
    "instagrapi>=2.1",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    "scikit-learn>=1.8.0",
    "numpy>=1.26.4",
]

[project.optional-dependencies]
graph = ["graspologic"]
dev = ["pytest>=8.0", "umap-learn>=0.5.12"]

[project.scripts]
ytk = "ytk.cli:cli"
ytk-mcp = "ytk.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the built React SPA inside the package so `ytk ui` serves /app from an
# installed copy. web/dist is committed (see web/.gitignore) and mapped into the
# wheel at ytk/ui/webdist, where server.py's _WEB_DIST looks for it.
[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "ytk/ui/webdist"

[tool.pytest.ini_options]
# eval marks live retrieval-gate runs (loads the encoder, hits the real
# chroma store); the fast suite skips them. Run explicitly: pytest -m eval
addopts = "-m 'not eval'"
markers = [
    "eval: live retrieval regression gate (real store + encoder)",
]
