<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytk map</title>
<style>
  :root { color-scheme: dark; }
  * { font-size: 14px; box-sizing: border-box; }
  body { font-family: system-ui; background: #111; color: #eee; margin: 0; overflow: hidden; }
  header { display: flex; gap: 1rem; align-items: center; padding: .8rem 1rem; background: #181818; position: fixed; top: 0; left: 0; right: 0; z-index: 5; }
  header a { color: #7dd3fc; text-decoration: none; font-weight: 600; }
  header a.here { color: #4ade80; }
  #views { display: flex; gap: .35rem; margin-left: .5rem; }
  .fchip { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 999px; padding: .2rem .7rem; cursor: pointer; font-family: inherit; }
  .fchip.on { background: #7dd3fc; border-color: #7dd3fc; color: #000; font-weight: 600; }
  header .hint { color: #888; margin-left: auto; }

  #stage { position: fixed; inset: 0; }
  #stage::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, #14161c 0%, #111 70%); }
  canvas { position: absolute; inset: 0; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  #labels .lb { position: absolute; transform: translate(-50%, -50%); color: #9b9b93;
    text-shadow: 0 1px 6px #000; white-space: nowrap; transition: opacity .25s;
    text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }

  #legend { position: fixed; left: 1rem; bottom: 1rem; z-index: 4;
    display: flex; flex-direction: column; gap: .25rem; max-height: 40vh; overflow-y: auto; }
  #legend .row, #legend .more { font-size: 12.5px; }
  #legend .more { color: #7dd3fc; cursor: pointer; padding-top: .15rem; }
  #legend .row { display: flex; align-items: center; gap: .5rem; cursor: pointer; color: #ddd; }
  #legend .row.off { opacity: .3; }
  #legend .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }
  #legend .n { color: #888; }

  #tip { position: fixed; z-index: 6; pointer-events: none; display: none;
    max-width: 300px; padding: .55rem .7rem; background: #1c1c1cee;
    border: 1px solid #333; border-radius: 10px; }
  #tip img { max-width: 100%; border-radius: 6px; margin-bottom: .4rem; display: block; }
  #tip .m { color: #888; margin-top: .2rem; }
</style>
</head>
<body>
<header>
  <a href="/">fresh</a>
  <a href="/inbox">inbox</a>
  <a href="/tags">tags</a>
  <a href="/map" class="here">map</a>
  <span id="views">
    <button class="fchip on" data-v="all">everything</button>
    <button class="fchip" data-v="content">content</button>
    <button class="fchip" id="sigchip">signal only</button>
  </span>
  <span class="hint" id="hint"></span>
</header>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
</div>
<div id="legend"></div>
<div id="tip"></div>

<script>
const PALETTE = ['#3987e5','#199e70','#c98500','#008300','#9085e9','#e66767','#d55181','#d95926'];
const GRAY = '#898781';

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });

const VS = `
attribute vec2 a_pos0;      // everything layout
attribute vec2 a_pos1;      // content layout (== pos0 for non-members)
attribute float a_size;
attribute vec3 a_col0;      // color in everything view
attribute vec3 a_col1;      // color in content view
attribute float a_alpha0;   // density-scaled alpha, everything view
attribute float a_alpha1;   // content view (fades non-members out)
attribute float a_group0;   // cluster index (for legend toggles)
attribute float a_group1;   // theme index
uniform vec2 u_cam; uniform float u_scale; uniform vec2 u_res;
uniform float u_t;          // 0 = everything, 1 = content
uniform float u_dpr;
uniform float u_galpha[40]; // legend toggle alphas, [0..31]=clusters, [32..39]=themes
varying vec3 v_col; varying float v_alpha;
void main() {
  vec2 w = mix(a_pos0, a_pos1, u_t);
  vec2 clip = (w - u_cam) * u_scale;
  clip.x *= u_res.y / u_res.x;
  gl_Position = vec4(clip, 0.0, 1.0);
  gl_PointSize = clamp(a_size * sqrt(u_scale) * u_dpr, 2.0, 28.0 * u_dpr);
  v_col = mix(a_col0, a_col1, u_t);
  float g0 = a_group0 < 0.0 ? 1.0 : u_galpha[int(a_group0)];
  float g1 = a_group1 < 0.0 ? 1.0 : u_galpha[int(a_group1) + 32];
  v_alpha = mix(a_alpha0 * g0, a_alpha1 * g1, u_t);
}`;
const FS = `
precision mediump float;
varying vec3 v_col; varying float v_alpha;
void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d = length(p);
  float core = smoothstep(0.5, 0.3, d);
  float halo = exp(-d * d * 3.0) * 0.55;
  float a = (core + halo) * v_alpha;
  gl_FragColor = vec4(v_col * a, a);   // premultiplied
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

const U = n => gl.getUniformLocation(prog, n);
const A = n => gl.getAttribLocation(prog, n);

let DATA = null, N = 0;
let pts = [];                       // CPU copy for picking/labels
let cam = { x: 0, y: 0, s: 1.6 };   // current camera
let tgt = { x: 0, y: 0, s: 1.6 };
let morph = 0, morphTgt = 0;        // u_t
let view = 'all';
let signalOnly = false;
let groupAlpha = new Float32Array(40).fill(1);
let dirty = true, hover = null, last = performance.now();

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

function buildBuffers() {
  const gs = DATA.all.groups.map((g, i) => ({ i, n: g.n }))
    .sort((a, b) => b.n - a.n);
  const slot = {};                   // top 8 clusters get palette slots
  gs.forEach((g, rank) => slot[g.i] = rank < 8 ? rank : -1);
  DATA.slot = slot;

  N = pts.length;
  const F = 13;
  const buf = new Float32Array(N * F);
  // density per grid cell of the everything layout -> alpha ~ 1/sqrt(n)
  const cell = p => (Math.floor((p.x + 1) * 24) * 64 + Math.floor((p.y + 1) * 24));
  const dens = {};
  for (const p of pts) dens[cell(p)] = (dens[cell(p)] || 0) + 1;

  pts.forEach((p, i) => {
    const isC = p.cx !== undefined;
    const a0 = Math.max(0.55, Math.min(1, 2.2 / Math.sqrt(dens[cell(p)]))) * (p.g < 0 ? 0.4 : 1);
    const s = slot[p.g] ?? -1;
    const col0 = p.g < 0 || s < 0 ? hex(GRAY) : hex(PALETTE[s]);
    const col1 = isC && p.th >= 0 ? hex(PALETTE[p.th % 8]) : hex(GRAY);
    const sigA = a => (signalOnly && p.r < 1 ? 0.04 : a);
    buf.set([
      p.x, p.y,
      isC ? p.cx : p.x, isC ? p.cy : p.y,
      3.2 + p.r * 1.8 + (isC ? 0.8 : 0),
      ...col0, ...col1,
      sigA(a0),
      sigA(isC ? 0.95 : 0.0),
    ], i * F);
  });
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
  const stride = F * 4;
  const attr = (name, size, off) => {
    const a = A(name);
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, size, gl.FLOAT, false, stride, off * 4);
  };
  attr('a_pos0', 2, 0); attr('a_pos1', 2, 2); attr('a_size', 1, 4);
  attr('a_col0', 3, 5); attr('a_col1', 3, 8);
  attr('a_alpha0', 1, 11); attr('a_alpha1', 1, 12);
  // group indices ride in alpha lanes? no — two more attributes:
}

// group attributes packed separately (kept simple: second buffer)
function buildGroupBuffer() {
  const g = new Float32Array(N * 2);
  pts.forEach((p, i) => {
    const s = DATA.slot[p.g] ?? -1;
    g[i * 2] = p.g < 0 || s < 0 ? -1 : s;
    g[i * 2 + 1] = p.cx !== undefined && p.th >= 0 ? p.th : -1;
  });
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, g, gl.STATIC_DRAW);
  const a0 = A('a_group0'), a1 = A('a_group1');
  gl.enableVertexAttribArray(a0);
  gl.vertexAttribPointer(a0, 1, gl.FLOAT, false, 8, 0);
  gl.enableVertexAttribArray(a1);
  gl.vertexAttribPointer(a1, 1, gl.FLOAT, false, 8, 4);
}

const dpr = Math.min(devicePixelRatio || 1, 2);
function resize() {
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
  dirty = true;
}
addEventListener('resize', resize);

function worldToScreen(x, y) {
  const t = morph;
  return [
    ((x - cam.x) * cam.s * (innerHeight / innerWidth) / 2 + 0.5) * innerWidth,
    (0.5 - (y - cam.y) * cam.s / 2) * innerHeight,
  ];
}
function screenToWorld(px, py) {
  return [
    (px / innerWidth - 0.5) * 2 / (cam.s * innerHeight / innerWidth) + cam.x,
    (0.5 - py / innerHeight) * 2 / cam.s + cam.y,
  ];
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const e = 1 - Math.exp(-8 * dt);
  let moving = false;
  for (const k of ['x', 'y', 's']) {
    const d = tgt[k] - cam[k];
    if (Math.abs(d) > 1e-4 * (k === 's' ? cam.s : 1)) { cam[k] += d * e; moving = true; }
    else cam[k] = tgt[k];
  }
  const dm = morphTgt - morph;
  if (Math.abs(dm) > 1e-3) { morph += dm * (1 - Math.exp(-5 * dt)); moving = true; }
  else morph = morphTgt;

  if (dirty || moving) {
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U('u_cam'), cam.x, cam.y);
    gl.uniform1f(U('u_scale'), cam.s);
    gl.uniform2f(U('u_res'), innerWidth, innerHeight);
    gl.uniform1f(U('u_t'), morph);
    gl.uniform1f(U('u_dpr'), dpr);
    gl.uniform1fv(U('u_galpha[0]'), groupAlpha);
    gl.drawArrays(gl.POINTS, 0, N);
    placeLabels();
    dirty = false;
  }
  requestAnimationFrame(frame);
}

function placeLabels() {
  const el = document.getElementById('labels');
  const groups = view === 'content' ? DATA.content.groups : DATA.all.groups;
  const base = view === 'content' ? 32 : 0;
  el.innerHTML = '';
  const placed = [];
  const order = groups.map((g, i) => [i, g]).sort((a, b) => b[1].n - a[1].n);
  order.forEach(([i, g], rank) => {
    if (!g.n || groupAlpha[base + i] < 0.5) return;
    let [x, y] = worldToScreen(g.x, g.y);
    if (x < 0 || y < 40 || x > innerWidth || y > innerHeight) return;
    // a label earns its place: cluster must occupy real screen space,
    // unless it is one of the few largest groups
    const spread = (g.rad || 0.05) * cam.s * innerHeight / 2;
    if (rank >= 6 && spread < 70) return;
    const alpha = rank < 6 ? 0.9 : Math.min(0.9, (spread - 70) / 120 + 0.35);
    const size = Math.max(10, Math.min(14, 9 + Math.sqrt(g.n) * 0.25));
    const w = g.label.length * size * 0.72;
    for (let k = 0; k < 10; k++) {
      if (!placed.some(q => Math.abs(q.y - y) < size + 8 && Math.abs(q.x - x) < (q.w + w) / 2 + 10)) break;
      y += size + 8;
    }
    placed.push({ x, y, w });
    const d = document.createElement('div');
    d.className = 'lb';
    d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;opacity:${alpha}`;
    d.textContent = g.label;
    el.appendChild(d);
  });
}

// --- picking (uniform grid over the active layout) -------------------------
let grid = null;
function buildGrid() {
  grid = new Map();
  const key = (x, y) => ((x + 2) * 50 | 0) * 1000 + ((y + 2) * 50 | 0);
  pts.forEach((p, i) => {
    const [x, y] = view === 'content' && p.cx !== undefined ? [p.cx, p.cy] : [p.x, p.y];
    const k = key(x, y);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(i);
  });
  grid.key = key;
}
function pick(px, py) {
  const [wx, wy] = screenToWorld(px, py);
  const rad = 10 / (cam.s * innerHeight / 2);
  let best = null, bd = rad * rad;
  const cx = (wx + 2) * 50 | 0, cy = (wy + 2) * 50 | 0;
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
    for (const i of grid.get((cx + dx) * 1000 + cy + dy) || []) {
      const p = pts[i];
      if (view === 'content' && p.cx === undefined) continue;
      if (signalOnly && p.r < 1) continue;
      const g = view === 'content' ? p.th : DATA.slot[p.g] ?? -1;
      if (g >= 0 && groupAlpha[(view === 'content' ? 32 : 0) + (view === 'content' ? p.th : g)] < 0.5) continue;
      const [x, y] = view === 'content' ? [p.cx, p.cy] : [p.x, p.y];
      const d = (x - wx) ** 2 + (y - wy) ** 2;
      if (d < bd) { bd = d; best = p; }
    }
  }
  return best;
}

const tip = document.getElementById('tip');
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
let drag = null, moved = 0;
canvas.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY }; moved = 0; canvas.classList.add('dragging'); });
addEventListener('mouseup', () => { drag = null; canvas.classList.remove('dragging'); });
addEventListener('mousemove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved += Math.abs(dx) + Math.abs(dy);
    tgt.x -= dx * 2 / (cam.s * innerHeight); cam.x = tgt.x;
    tgt.y += dy * 2 / (cam.s * innerHeight); cam.y = tgt.y;
    drag = { x: e.clientX, y: e.clientY };
    tip.style.display = 'none'; dirty = true; return;
  }
  const p = pick(e.clientX, e.clientY);
  if (p !== hover) { hover = p; dirty = true; }
  if (!p) { tip.style.display = 'none'; return; }
  const groups = view === 'content' ? DATA.content.groups : DATA.all.groups;
  const gi = view === 'content' ? p.th : p.g;
  const gname = gi >= 0 && groups[gi] ? groups[gi].label : 'dust';
  const sig = ['', 'saved', 'thought', 'directive'][p.r] || '';
  const img = p.img && p.u ? `<img src="/api/cover?u=${encodeURIComponent(p.u)}" loading="lazy">` : '';
  tip.innerHTML = `${img}<div>${esc(p.t)}</div>
    <div class="m">${esc(p.c)} · ${esc(gname)}${sig ? ' · ' + sig : ''}${p.d ? ' · ' + p.d : ''}</div>`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 16) + 'px';
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0016);
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  tgt.s = Math.max(0.4, Math.min(40, tgt.s * f));
  tgt.x = wx - (wx - tgt.x) / f;
  tgt.y = wy - (wy - tgt.y) / f;
}, { passive: false });
canvas.addEventListener('click', () => { if (hover && hover.u && moved < 4) window.open(hover.u, '_blank'); });

// --- view + legend ---------------------------------------------------------
function setView(v) {
  view = v;
  morphTgt = v === 'content' ? 1 : 0;
  document.querySelectorAll('#views [data-v]').forEach(b =>
    b.classList.toggle('on', b.dataset.v === v));
  buildGrid();
  buildLegend();
  const p = DATA[v].params;
  document.getElementById('hint').textContent =
    `${v === 'content' ? pts.filter(x => x.cx !== undefined).length : pts.length} notes · trust ${p.trustworthiness.toFixed(2)} · sil ${p.silhouette.toFixed(2)}`;
  dirty = true;
}
let legendOpen = false;
function buildLegend() {
  const el = document.getElementById('legend');
  const groups = view === 'content' ? DATA.content.groups : DATA.all.groups;
  const base = view === 'content' ? 32 : 0;
  const color = i => view === 'content'
    ? PALETTE[i % 8]
    : (DATA.slot[i] ?? -1) >= 0 ? PALETTE[DATA.slot[i]] : GRAY;
  const order = groups.map((g, i) => [i, g]).filter(([, g]) => g.n)
    .sort((a, b) => b[1].n - a[1].n);
  const shown = legendOpen ? order : order.slice(0, 8);
  el.innerHTML = shown.map(([i, g]) =>
    `<div class="row${groupAlpha[base + i] < 0.5 ? ' off' : ''}" data-i="${i}">
      <span class="dot" style="background:${color(i)}"></span>${esc(g.label)}
      <span class="n">${g.n}</span></div>`).join('')
    + (order.length > 8
      ? `<div class="more">${legendOpen ? 'less' : '+ ' + (order.length - 8) + ' more'}</div>` : '');
  el.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
    const i = base + +r.dataset.i;
    groupAlpha[i] = groupAlpha[i] < 0.5 ? 1 : 0;
    r.classList.toggle('off');
    dirty = true;
  }));
  const more = el.querySelector('.more');
  if (more) more.addEventListener('click', () => { legendOpen = !legendOpen; buildLegend(); });
}
document.querySelectorAll('#views [data-v]').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.v)));
document.getElementById('sigchip').addEventListener('click', function () {
  signalOnly = !signalOnly;
  this.classList.toggle('on');
  buildBuffers(); buildGroupBuffer();
  dirty = true;
});

function computeSpreads() {
  const acc = (groups, pos, idx) => {
    const s = groups.map(() => ({ n: 0, d: 0 }));
    for (const p of pts) {
      const i = idx(p);
      if (i === undefined || i < 0 || !groups[i]) continue;
      const [x, y] = pos(p);
      s[i].n++; s[i].d += (x - groups[i].x) ** 2 + (y - groups[i].y) ** 2;
    }
    groups.forEach((g, i) => g.rad = s[i].n ? Math.sqrt(s[i].d / s[i].n) : 0);
  };
  acc(DATA.all.groups, p => [p.x, p.y], p => p.g);
  acc(DATA.content.groups, p => [p.cx, p.cy], p => p.cx !== undefined ? p.th : -1);
}

fetch('/api/map').then(r => r.json()).then(d => {
  DATA = d; pts = d.points;
  computeSpreads();
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  tgt.x = cam.x = (Math.min(...xs) + Math.max(...xs)) / 2;
  tgt.y = cam.y = (Math.min(...ys) + Math.max(...ys)) / 2;
  const ex = (Math.max(...xs) - Math.min(...xs)) / 2;
  const ey = (Math.max(...ys) - Math.min(...ys)) / 2;
  tgt.s = cam.s = 0.92 * Math.min((innerWidth / innerHeight) / ex, 1 / ey);
  buildBuffers();
  buildGroupBuffer();
  resize();
  setView(location.hash === '#content' ? 'content' : 'all');
  morph = morphTgt;
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
