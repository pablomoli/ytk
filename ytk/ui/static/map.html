<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytk map</title>
<style>
  :root { color-scheme: dark; }
  * { font-size: 14px; box-sizing: border-box; }
  body { font-family: system-ui; background: #111; color: #eee; margin: 0; overflow: hidden; }
  header { display: flex; gap: 1rem; align-items: center; padding: .8rem 1rem; background: #181818; position: fixed; top: 0; left: 0; right: 0; z-index: 5; }
  header a { color: #e2b04a; text-decoration: none; font-weight: 600; }
  header a.here { color: #4ade80; }
  #views { display: flex; gap: .35rem; margin-left: .5rem; }
  .fchip { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 999px; padding: .2rem .7rem; cursor: pointer; font-family: inherit; }
  .fchip.on { background: #e2b04a; border-color: #e2b04a; color: #000; font-weight: 600; }
  header .hint { color: #888; margin-left: auto; }

  body { background: #000; }
  #stage { position: fixed; inset: 0; background: #000; }
  canvas { position: absolute; inset: 0; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  #labels .lb { position: absolute; transform: translate(-50%, -50%); color: #9b9b93;
    text-shadow: 0 1px 6px #000; white-space: nowrap; transition: opacity .25s;
    text-transform: uppercase; letter-spacing: .08em; font-weight: 500; }

  #panel { position: fixed; top: 3.4rem; right: .8rem; bottom: .8rem; z-index: 4;
    width: 262px; display: flex; flex-direction: column;
    background: #161618e6; border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; backdrop-filter: blur(8px);
    transition: width .25s cubic-bezier(.25,.1,.25,1); overflow: hidden; }
  #panel.slim { width: 40px; }
  #panel .phead { display: flex; gap: .3rem; padding: .7rem 2rem .5rem .7rem;
    align-items: center; flex-wrap: wrap; }
  #panel.slim .phead, #panel.slim #rows, #panel.slim .pfoot { display: none; }
  #ptoggle { position: absolute; top: .45rem; right: .45rem; z-index: 2;

  #rows .rhead { display: flex; justify-content: space-between; color: #83817a;
    font-family: "Newsreader", Georgia, serif; font-size: 10.5px;

    padding: .2rem .35rem .35rem; border-bottom: 1px solid rgba(255,255,255,.07);
    margin-bottom: .25rem; }
  #rows .row { display: flex; align-items: center; gap: .55rem; cursor: pointer;
    color: #b7b5aa; padding: .28rem .35rem; border-radius: 6px; }
  #rows .row:hover { background: rgba(255,255,255,.05); color: #f0eee7; }
  #rows .row.off { opacity: .32; }
  #rows .n { color: #83817a; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }

    border-top: 1px solid rgba(255,255,255,.08); }

  #tip { position: fixed; z-index: 6; pointer-events: none; display: none;
    max-width: 300px; padding: .55rem .7rem; background: #1c1c1cee;
    border: 1px solid #333; border-radius: 10px; }
  #tip img { max-width: 100%; border-radius: 6px; margin-bottom: .4rem; display: block; }
  #tip .m { color: #888; margin-top: .2rem; }
</style>
<link rel="stylesheet" href="/static/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='10' cy='20' r='4' fill='%235b7cfa'/%3E%3Ccircle cx='21' cy='10' r='3' fill='%23d9a520'/%3E%3Ccircle cx='23' cy='22' r='2.4' fill='%23e0507e'/%3E%3C/svg%3E">
</head>
<body>
<header>
  <a href="/">fresh</a>
  <a href="/inbox">inbox</a>
  <a href="/tags">tags</a>
  <a href="/map" class="here">map</a>
  <span class="hint" id="hint"></span>
</header>
<div id="stage">
  <canvas id="gl"></canvas>
  <svg id="leaders" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></svg>
  <div id="labels"></div>
</div>
<aside id="panel">
  <button id="ptoggle" title="collapse">&#9656;</button>
  <div id="dots"></div>
  <div class="phead" id="views">
    <button class="fchip on" data-v="all">everything</button>
    <button class="fchip" data-v="content">content</button>
    <button class="fchip" id="sigchip">signal</button>
    <button class="fchip" id="recchip">recent</button>
    <button class="fchip" id="dimchip">3d</button>
  </div>
  <div id="rows"></div>
  <div class="pfoot" id="pstats"></div>
</aside>
<div id="tip"></div>

<script>
const GRAY = '#6f6d66';
// one multi-hue ramp colors every group: clusters sample it by size rank,
// so the legend reads as a deliberate gradient instead of assorted hues
const RAMP = ['#5b7cfa','#2fb7c9','#43c26a','#d9a520','#e8703a','#e0507e','#9d6bf0'];
function rampColor(t) {
  const x = Math.max(0, Math.min(0.9999, t)) * (RAMP.length - 1);
  const i = Math.floor(x), f = x - i;
  const a = RAMP[i], b = RAMP[i + 1];
  const ch = (s, o) => parseInt(s.slice(o, o + 2), 16);
  const mix = o => Math.round(ch(a, o) + (ch(b, o) - ch(a, o)) * f);
  return `rgb(${mix(1)}, ${mix(3)}, ${mix(5)})`;
}
function cssToRgb(c) {
  const el = document.createElement('div');
  el.style.color = c; document.body.appendChild(el);
  const m = getComputedStyle(el).color.match(/\d+/g);
  el.remove();
  return m.slice(0, 3).map(v => v / 255);
}
const _rgbCache = {};
const colorOf = c => _rgbCache[c] || (_rgbCache[c] = cssToRgb(c));

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: true });

const VS = `
attribute vec3 a_p0_3;      // everything layout, 3D
attribute vec3 a_p1_3;      // content layout, 3D
attribute vec2 a_p0_2;      // everything layout, 2D
attribute vec2 a_p1_2;      // content layout, 2D
attribute float a_size;
attribute vec3 a_col0;
attribute vec3 a_col1;
attribute float a_alpha0;
attribute float a_alpha1;
attribute float a_group0;   // cluster index
attribute float a_group1;   // theme index
uniform mat4 u_mvp;
uniform float u_t;          // 0 = everything, 1 = content
uniform float u_dim;        // 0 = flat, 1 = volume
uniform float u_sizek;      // pixels-per-world at dist 1
uniform float u_dpr;
uniform float u_galpha[40];
uniform float u_dust;       // dust visibility: drops to ~0 while focusing
varying vec3 v_col; varying float v_alpha;
void main() {
  vec3 p3 = mix(a_p0_3, a_p1_3, u_t);
  vec2 p2 = mix(a_p0_2, a_p1_2, u_t);
  vec3 w = mix(vec3(p2, 0.0), p3, u_dim);
  gl_Position = u_mvp * vec4(w, 1.0);
  float att = u_sizek / max(gl_Position.w, 0.15);
  gl_PointSize = clamp(a_size * att * u_dpr * 0.075, 1.8, 26.0 * u_dpr);
  v_col = mix(a_col0, a_col1, u_t);
  float g0 = a_group0 < 0.0 ? u_dust : u_galpha[int(a_group0)];
  float g1 = a_group1 < 0.0 ? u_dust : u_galpha[int(a_group1) + 32];
  v_alpha = mix(a_alpha0 * g0, a_alpha1 * g1, u_t);
}`;
const FS = `
precision mediump float;
varying vec3 v_col; varying float v_alpha;
void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float d2 = dot(p, p);
  float a = smoothstep(1.0, 0.82, sqrt(d2)) * v_alpha;
  // matte clay shading: wrapped diffuse, faint spec, edge falloff
  float z = sqrt(max(0.0, 1.0 - d2));
  vec3 n = vec3(p.x, -p.y, z);
  vec3 L = normalize(vec3(-0.45, 0.55, 0.72));
  float wrap = (dot(n, L) + 0.6) / 1.6;
  float diff = 0.35 + 0.65 * clamp(wrap, 0.0, 1.0);
  float spec = pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 12.0) * 0.10;
  vec3 c = v_col * diff * (0.75 + 0.25 * z) + vec3(spec);
  gl_FragColor = vec4(c * a, a);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
const U = n => gl.getUniformLocation(prog, n);
const A = n => gl.getAttribLocation(prog, n);

// --- state -----------------------------------------------------------------
let DATA = null, N = 0, pts = [];
let view = 'all', signalOnly = false, recency = false;
const NOW = Date.parse(document.lastModified) || 1751750000000;
function ageFade(p) {
  // 90-day half-life on note age; undated notes read as old
  if (!p.d) return 0.12;
  const days = (NOW - Date.parse(p.d)) / 86400000;
  return Math.max(0.12, Math.pow(0.5, Math.max(0, days) / 90));
}
let morph = 0, morphTgt = 0;          // all <-> content
let dim = 1, dimTgt = 1;              // flat <-> volume (3D default)
let cam  = { theta: 0.5, phi: 0.3, dist: 2.3, tx: 0, ty: 0, tz: 0 };
let tgt  = { ...cam };
let groupAlpha = new Float32Array(40).fill(1);
let hoverGroup = -1, hover = -1, soloGroup = -1;
let dirty = true, last = performance.now();
let mvp = new Float32Array(16);
let sxy = null;                       // cached screen positions for picking

const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const dpr = Math.min(devicePixelRatio || 1, 2);

// --- matrices ---------------------------------------------------------------
function mat4mul(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
    o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
  return o;
}
function buildMvp() {
  const eye = [
    cam.tx + cam.dist * Math.cos(cam.phi) * Math.sin(cam.theta),
    cam.ty + cam.dist * Math.sin(cam.phi),
    cam.tz + cam.dist * Math.cos(cam.phi) * Math.cos(cam.theta),
  ];
  const t = [cam.tx, cam.ty, cam.tz];
  let f = [t[0] - eye[0], t[1] - eye[1], t[2] - eye[2]];
  const fl = Math.hypot(...f); f = f.map(v => v / fl);
  let r = [f[2], 0, -f[0]];
  const rl = Math.hypot(...r) || 1; r = r.map(v => v / rl);
  const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
  const viewM = new Float32Array([
    r[0], u[0], -f[0], 0,
    r[1], u[1], -f[1], 0,
    r[2], u[2], -f[2], 0,
    -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]),
    -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]),
    f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2], 1,
  ]);
  const fov = 0.6, aspect = innerWidth / innerHeight;
  const fpp = 1 / Math.tan(fov / 2), near = 0.05, far = 50;
  const proj = new Float32Array([
    fpp / aspect, 0, 0, 0,
    0, fpp, 0, 0,
    0, 0, (far + near) / (near - far), -1,
    0, 0, 2 * far * near / (near - far), 0,
  ]);
  mvp = mat4mul(proj, viewM);
  camRight = r;
  return fpp;
}
let camRight = [1, 0, 0];

function worldOf(p) {
  const t = morph, d3 = dim;
  const has = p.c3 !== undefined;
  const x2 = has ? p.x + (p.cx - p.x) * t : p.x;
  const y2 = has ? p.y + (p.cy - p.y) * t : p.y;
  const p3 = p.z3, c3 = has ? p.c3 : p.z3;
  return [
    (1 - d3) * x2 + d3 * (p3[0] + (c3[0] - p3[0]) * t),
    (1 - d3) * y2 + d3 * (p3[1] + (c3[1] - p3[1]) * t),
    d3 * (p3[2] + (c3[2] - p3[2]) * t),
  ];
}
function projectPt(w) {
  const m = mvp;
  const cw = m[3] * w[0] + m[7] * w[1] + m[11] * w[2] + m[15];
  const cx = (m[0] * w[0] + m[4] * w[1] + m[8] * w[2] + m[12]) / cw;
  const cy = (m[1] * w[0] + m[5] * w[1] + m[9] * w[2] + m[13]) / cw;
  return [(cx * 0.5 + 0.5) * innerWidth, (0.5 - cy * 0.5) * innerHeight, cw];
}

// --- buffers -----------------------------------------------------------------
function buildBuffers() {
  const order = DATA.all.groups.map((g, i) => ({ i, n: g.n })).sort((a, b) => b.n - a.n);
  const rank = {};
  order.forEach((g, r) => rank[g.i] = r);
  DATA.rank = rank;
  DATA.nGroups = order.length;

  N = pts.length;
  const F = 20;
  const buf = new Float32Array(N * F);
  const cell = p => (Math.floor((p.x + 1) * 24) * 64 + Math.floor((p.y + 1) * 24));
  const dens = {};
  for (const p of pts) dens[cell(p)] = (dens[cell(p)] || 0) + 1;

  pts.forEach((p, i) => {
    const isC = p.c3 !== undefined;
    const a0 = p.g < 0 ? 0.4 : 1;
    const col0 = p.g < 0 ? hex(GRAY)
      : colorOf(rampColor(rank[p.g] / Math.max(1, DATA.nGroups - 1)));
    const col1 = isC && p.th >= 0 ? colorOf(rampColor(p.th / 7)) : hex(GRAY);
    const rec = recency ? ageFade(p) : 1;
    const sigA = a => (signalOnly && p.r < 1 ? 0.04 : a * rec);
    buf.set([
      ...p.z3,
      ...(isC ? p.c3 : p.z3),
      p.x, p.y,
      isC ? p.cx : p.x, isC ? p.cy : p.y,
      3.2 + p.r * 1.8 + (isC ? 0.8 : 0),
      ...col0, ...col1,
      sigA(a0), sigA(isC ? 0.95 : 0.0),
      p.g < 0 ? -1 : p.g,
    ], i * F);
  });
  mainBuf = mainBuf || gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, mainBuf);
  gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
  // a_group1 in a second buffer to stay under the main stride
  const g2 = new Float32Array(N);
  pts.forEach((p, i) => g2[i] = p.c3 !== undefined && p.th >= 0 ? p.th : -1);
  grpBuf = grpBuf || gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, grpBuf);
  gl.bufferData(gl.ARRAY_BUFFER, g2, gl.STATIC_DRAW);
}

const F = 20;
let mainBuf = null, grpBuf = null, orbBuf = null, orbGrpBuf = null;
function bindSet(buf, gbuf) {
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  const stride = F * 4;
  const attr = (name, size, off) => {
    const a = A(name);
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, size, gl.FLOAT, false, stride, off * 4);
  };
  attr('a_p0_3', 3, 0); attr('a_p1_3', 3, 3);
  attr('a_p0_2', 2, 6); attr('a_p1_2', 2, 8);
  attr('a_size', 1, 10);
  attr('a_col0', 3, 11); attr('a_col1', 3, 14);
  attr('a_alpha0', 1, 17); attr('a_alpha1', 1, 18);
  attr('a_group0', 1, 19);
  gl.bindBuffer(gl.ARRAY_BUFFER, gbuf);
  const a1 = A('a_group1');
  gl.enableVertexAttribArray(a1);
  gl.vertexAttribPointer(a1, 1, gl.FLOAT, false, 4, 0);
}

// --- group centroids/spreads (per view+dim, computed client-side) -----------
function groupStats() {
  const groups = view === 'content' ? DATA.content.groups : DATA.all.groups;
  const idx = view === 'content' ? (p => p.c3 !== undefined ? p.th : -1) : (p => p.g);
  const acc = groups.map(() => ({ n: 0, x: 0, y: 0, z: 0, d: 0 }));
  for (const p of pts) {
    const i = idx(p);
    if (i === undefined || i < 0 || !acc[i]) continue;
    const w = worldOf(p);
    acc[i].n++; acc[i].x += w[0]; acc[i].y += w[1]; acc[i].z += w[2];
  }
  acc.forEach(a => { if (a.n) { a.x /= a.n; a.y /= a.n; a.z /= a.n; } });
  for (const p of pts) {
    const i = idx(p);
    if (i === undefined || i < 0 || !acc[i]) continue;
    const w = worldOf(p);
    acc[i].d += (w[0] - acc[i].x) ** 2 + (w[1] - acc[i].y) ** 2 + (w[2] - acc[i].z) ** 2;
  }
  return groups.map((g, i) => ({
    label: g.label, n: g.n,
    c: [acc[i].x, acc[i].y, acc[i].z],
    rad: acc[i].n ? Math.sqrt(acc[i].d / acc[i].n) : 0,
  }));
}

// --- render loop --------------------------------------------------------------
function resize() {
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px'; canvas.style.height = innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
  dirty = true;
}
addEventListener('resize', resize);

function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const e = 1 - Math.exp(-8 * dt);
  let moving = false;
  for (const k of ['theta', 'phi', 'dist', 'tx', 'ty', 'tz']) {
    const d = tgt[k] - cam[k];
    if (Math.abs(d) > 1e-4) { cam[k] += d * e; moving = true; } else cam[k] = tgt[k];
  }
  const dm = morphTgt - morph;
  if (Math.abs(dm) > 1e-3) { morph += dm * (1 - Math.exp(-5 * dt)); moving = true; } else morph = morphTgt;
  const dd = dimTgt - dim;
  if (Math.abs(dd) > 1e-3) { dim += dd * (1 - Math.exp(-5 * dt)); moving = true; } else dim = dimTgt;
  if (dim !== dimTgt || morph !== morphTgt) moving = true;

  if (dirty || moving) {
    const fpp = buildMvp();
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniformMatrix4fv(U('u_mvp'), false, mvp);
    gl.uniform1f(U('u_t'), morph);
    gl.uniform1f(U('u_dim'), dim);
    gl.uniform1f(U('u_sizek'), fpp * innerHeight * 0.5 * 0.02);
    gl.uniform1f(U('u_dpr'), dpr);
    gl.uniform1f(U('u_dust'), (soloGroup >= 0 || hoverGroup >= 0) ? 0.04 : 1.0);
    const eff = new Float32Array(groupAlpha);
    const base = view === 'content' ? 32 : 0;
    const nG = view === 'content' ? 8 : 32;
    if (hoverGroup >= 0) {
      for (let i = base; i < base + nG; i++)
        if (i !== base + hoverGroup) eff[i] *= 0.08;
    }
    // adaptive clustering: while a cluster is small on screen it condenses
    // into one orb; zooming in dissolves the orb into its points
    const stats = groupStats();
    const aggT = stats.map(g => {
      if (!g.n) return 1;
      const [x0] = projectPt(g.c);
      const [xr] = projectPt([g.c[0] + g.rad * camRight[0], g.c[1] + g.rad * camRight[1], g.c[2] + g.rad * camRight[2]]);
      g.spread = Math.abs(xr - x0);
      return Math.max(0, Math.min(1, (g.spread - 45) / 70));
    });
    const effPts = new Float32Array(eff);
    for (let i = 0; i < nG; i++) effPts[base + i] *= aggT[i] ?? 1;
    bindSet(mainBuf, grpBuf);
    gl.uniform1fv(U('u_galpha[0]'), effPts);
    gl.drawArrays(gl.POINTS, 0, N);
    drawOrbs(stats, aggT, eff, base);
    cacheProjections();
    placeLabels(stats);
    dirty = false;
  }
  requestAnimationFrame(frame);
}

function buildSubs() {
  // static partition of each cluster into spatial sub-blobs, so aggregation
  // preserves the cluster's silhouette instead of collapsing to one orb
  const isC = view === 'content';
  const key = view;
  DATA._subs = DATA._subs || {};
  if (DATA._subs[key]) return DATA._subs[key];
  const cells = new Map();
  const CELL = 0.13;
  pts.forEach((p, i) => {
    const gi = isC ? (p.c3 !== undefined ? p.th : -1) : p.g;
    if (gi === undefined || gi < 0) return;
    const c = isC ? p.c3 : p.z3;
    const k = gi + ':' + Math.round(c[0] / CELL) + ':' + Math.round(c[1] / CELL) + ':' + Math.round(c[2] / CELL);
    if (!cells.has(k)) cells.set(k, { gi, idxs: [] });
    cells.get(k).idxs.push(i);
  });
  return DATA._subs[key] = [...cells.values()];
}

function drawOrbs(stats, aggT, eff, base) {
  const rows = [];
  for (const sub of buildSubs()) {
    const orbA = (1 - (aggT[sub.gi] ?? 1)) * (eff[base + sub.gi] ?? 1);
    if (orbA < 0.02) continue;
    let x = 0, y = 0, z = 0;
    for (const i of sub.idxs) {
      const w = worldOf(pts[i]);
      x += w[0]; y += w[1]; z += w[2];
    }
    const m = sub.idxs.length;
    x /= m; y /= m; z /= m;
    const col = colorOf(groupColor(sub.gi));
    rows.push([
      x, y, z, x, y, z, x, y, x, y,
      4.5 + Math.sqrt(m) * 1.5,
      ...col, ...col,
      orbA * 0.95, orbA * 0.95,
      -1,
    ]);
  }
  if (!rows.length) return;
  orbBuf = orbBuf || gl.createBuffer();
  orbGrpBuf = orbGrpBuf || gl.createBuffer();
  const flat = new Float32Array(rows.length * F);
  rows.forEach((r, i) => flat.set(r, i * F));
  gl.bindBuffer(gl.ARRAY_BUFFER, orbBuf);
  gl.bufferData(gl.ARRAY_BUFFER, flat, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, orbGrpBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(rows.length).fill(-1), gl.DYNAMIC_DRAW);
  bindSet(orbBuf, orbGrpBuf);
  gl.drawArrays(gl.POINTS, 0, rows.length);
}

function cacheProjections() {
  if (!sxy || sxy.length < N * 2) sxy = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) {
    const [x, y, w] = projectPt(worldOf(pts[i]));
    sxy[i * 2] = w > 0 ? x : -9999;
    sxy[i * 2 + 1] = y;
  }
}

// --- labels ---------------------------------------------------------------
function placeLabels(stats) {
  const el = document.getElementById('labels');
  const svg = document.getElementById('leaders');
  const base = view === 'content' ? 32 : 0;
  el.innerHTML = '';
  let lines = '';
  const placed = [];
  const order = stats.map((g, i) => [i, g]).sort((a, b) => b[1].n - a[1].n);
  const edge = document.getElementById('panel').classList.contains('slim') ? 70 : 290;
  order.forEach(([i, g], rank) => {
    if (!g.n || groupAlpha[base + i] < 0.5) return;
    const [x0, y0, w] = projectPt(g.c);
    if (w <= 0) return;
    if (x0 < 0 || y0 < 40 || x0 > innerWidth - edge || y0 > innerHeight) return;
    const spread = g.spread ?? 0;
    if (rank >= 6 && spread < 70) return;
    const alpha = rank < 6 ? 0.9 : Math.min(0.9, (spread - 70) / 120 + 0.35);
    const size = Math.max(10, Math.min(14, 9 + Math.sqrt(g.n) * 0.25));
    const wpx = g.label.length * size * 0.72;
    // offset the label above the cluster's edge, out of the data's way
    let x = x0, y = y0 - spread - 22;
    for (let k = 0; k < 10; k++) {
      if (!placed.some(q => Math.abs(q.y - y) < size + 8 && Math.abs(q.x - x) < (q.w + wpx) / 2 + 10)) break;
      y -= size + 8;
    }
    if (y < 46) y = 46;
    placed.push({ x, y, w: wpx });
    const d = document.createElement('div');
    d.className = 'lb';
    d.style.cssText = `left:${x}px;top:${y}px;font-size:${size}px;opacity:${alpha}`;
    d.textContent = g.label;
    el.appendChild(d);
    const gap = y0 - y - size;                 // leader only if there is distance
    if (gap > 14) lines += `<line x1="${x0}" y1="${y0 - Math.min(spread * 0.7, gap - 6)}" x2="${x0}" y2="${y + size * 0.8}" stroke="rgba(255,255,255,${0.16 * alpha})" stroke-width="1"/>`;
  });
  svg.innerHTML = lines;
}

// --- picking + tooltip -------------------------------------------------------
const tip = document.getElementById('tip');
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
function visible(p) {
  if (signalOnly && p.r < 1) return false;
  const gi = view === 'content' ? (p.c3 !== undefined ? p.th : -2) : p.g;
  if (gi === -2) return false;
  if (soloGroup >= 0 && gi !== soloGroup) return false;   // focus owns picking
  if (gi < 0) return soloGroup < 0;                       // dust unpickable while focused
  return groupAlpha[(view === 'content' ? 32 : 0) + gi] >= 0.5;
}
function pick(mx, my) {
  if (!sxy) return -1;
  let best = -1, bd = 12 * 12;
  for (let i = 0; i < N; i++) {
    const dx = sxy[i * 2] - mx, dy = sxy[i * 2 + 1] - my;
    const d = dx * dx + dy * dy;
    if (d < bd && visible(pts[i])) { bd = d; best = i; }
  }
  return best;
}

let drag = null, moved = 0, panMode = false;
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {
  drag = { x: e.clientX, y: e.clientY }; moved = 0;
  if (e.button === 1) e.preventDefault();
  panMode = e.button === 2 || e.button === 1 || e.shiftKey || dimTgt < 0.5;
  canvas.classList.add('dragging');
});
addEventListener('mouseup', () => { drag = null; canvas.classList.remove('dragging'); });
addEventListener('mousemove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    moved += Math.abs(dx) + Math.abs(dy);
    if (panMode) {
      const k = cam.dist / (innerHeight * 0.9);
      tgt.tx -= (dx * camRight[0]) * k; tgt.tz -= (dx * camRight[2]) * k;
      tgt.ty += dy * k;
    } else {
      tgt.theta -= dx * 0.005;
      tgt.phi = Math.max(-1.35, Math.min(1.35, tgt.phi + dy * 0.005));
    }
    drag = { x: e.clientX, y: e.clientY };
    tip.style.display = 'none'; dirty = true; return;
  }
  const i = pick(e.clientX, e.clientY);
  if (i !== hover) { hover = i; }
  if (i < 0) { tip.style.display = 'none'; return; }
  const p = pts[i];
  const groups = view === 'content' ? DATA.content.groups : DATA.all.groups;
  const gi = view === 'content' ? p.th : p.g;
  const gname = gi >= 0 && groups[gi] ? groups[gi].label : 'dust';
  const sig = ['', 'saved', 'thought', 'directive'][p.r] || '';
  const img = p.img && p.u ? `<img src="/api/cover?u=${encodeURIComponent(p.u)}" loading="lazy">` : '';
  tip.innerHTML = `${img}<div>${esc(p.t)}</div>
    <div class="m">${esc(p.c)} · ${esc(gname)}${sig ? ' · ' + sig : ''}${p.d ? ' · ' + p.d : ''}</div>`;
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 320) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 16) + 'px';
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tgt.dist = Math.max(0.3, Math.min(12, tgt.dist * Math.exp(e.deltaY * 0.0012)));
}, { passive: false });
canvas.addEventListener('click', () => {
  if (moved >= 4) return;
  if (hover < 0) {                         // click empty space: release focus
    if (soloGroup >= 0) {
      soloGroup = -1;
      groupAlpha.fill(1);
      buildLegend(); dirty = true;
    }
    return;
  }
  const p = pts[hover];
  const w = worldOf(p);                     // fly to the node, focus its cluster
  tgt.tx = w[0]; tgt.ty = w[1]; tgt.tz = w[2];
  tgt.dist = Math.min(tgt.dist, 0.9);
  const gi = view === 'content' ? p.th : p.g;
  if (gi >= 0) {
    const base = view === 'content' ? 32 : 0;
    const nG = view === 'content' ? 8 : 32;
    soloGroup = gi;
    for (let k = 0; k < nG; k++) groupAlpha[base + k] = k === gi ? 1 : 0;
    buildLegend();
  }
  dirty = true;
});
canvas.addEventListener('dblclick', () => {
  if (hover >= 0 && pts[hover].u) window.open(pts[hover].u, '_blank');
});

// --- panel ----------------------------------------------------------------
let legendOpen = false;
function groupColor(i) {
  if (view === 'content') return rampColor(i / 7);
  return rampColor((DATA.rank[i] ?? 0) / Math.max(1, DATA.nGroups - 1));
}
function buildLegend() {
  const el = document.getElementById('rows');
  const groups = view === 'content' ? DATA.content.groups : DATA.all.groups;
  const base = view === 'content' ? 32 : 0;
  const order = groups.map((g, i) => [i, g]).filter(([, g]) => g.n)
    .sort((a, b) => b[1].n - a[1].n);
  el.innerHTML = `<div class="rhead"><span>cluster</span><span>notes</span></div>`
    + order.map(([i, g]) =>
    `<div class="row${groupAlpha[base + i] < 0.5 ? ' off' : ''}" data-i="${i}"
      title="${g.n} notes — click to focus, click again to restore, alt-click to hide">
      <span class="dot" style="background:${groupColor(i)}"></span>${esc(g.label)}
      <span class="n">${g.n}</span></div>`).join('');
  el.querySelectorAll('.row').forEach(r => {
    const i = +r.dataset.i;
    r.addEventListener('click', e => {
      const nG = view === 'content' ? 8 : 32;
      if (e.altKey) {                       // alt-click: hide just this one
        groupAlpha[base + i] = groupAlpha[base + i] < 0.5 ? 1 : 0;
      } else if (soloGroup === i) {          // click again: restore all
        soloGroup = -1;
        for (let k = 0; k < nG; k++) groupAlpha[base + k] = 1;
      } else {                               // click: focus only this cluster
        soloGroup = i;
        for (let k = 0; k < nG; k++) groupAlpha[base + k] = k === i ? 1 : 0;
      }
      buildLegend();
      dirty = true;
    });
    r.addEventListener('mouseenter', () => { hoverGroup = i; dirty = true; });
    r.addEventListener('mouseleave', () => { hoverGroup = -1; dirty = true; });
  });
  document.getElementById('dots').innerHTML = order.slice(0, 10).map(([i]) =>
    `<span class="dot" style="background:${groupColor(i)}"></span>`).join('');
}
document.getElementById('ptoggle').addEventListener('click', () => {
  const p = document.getElementById('panel');
  p.classList.toggle('slim');
  document.getElementById('ptoggle').innerHTML =
    p.classList.contains('slim') ? '&#9666;' : '&#9656;';
  dirty = true;
});

function setView(v) {
  view = v;
  soloGroup = -1;
  groupAlpha.fill(1);
  morphTgt = v === 'content' ? 1 : 0;
  document.querySelectorAll('#views [data-v]').forEach(b =>
    b.classList.toggle('on', b.dataset.v === v));
  buildLegend();
  const p = DATA[v].params;
  document.getElementById('pstats').innerHTML =
    `${v === 'content' ? pts.filter(x => x.c3 !== undefined).length : pts.length} notes · trust ${(p.trustworthiness_3d ?? p.trustworthiness).toFixed(2)} · sil ${p.silhouette.toFixed(2)}<br>drag orbit · right-drag pan · scroll zoom`;
  dirty = true;
}
document.querySelectorAll('#views [data-v]').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.v)));
document.getElementById('sigchip').addEventListener('click', function () {
  signalOnly = !signalOnly;
  this.classList.toggle('on');
  buildBuffers();
  dirty = true;
});
document.getElementById('recchip').addEventListener('click', function () {
  recency = !recency;
  this.classList.toggle('on');
  buildBuffers();
  dirty = true;
});
document.getElementById('dimchip').addEventListener('click', function () {
  dimTgt = dimTgt > 0.5 ? 0 : 1;
  this.textContent = dimTgt > 0.5 ? '2d' : '3d';
  if (dimTgt < 0.5) { tgt.theta = 0; tgt.phi = 0; }
  dirty = true;
});

fetch('/api/map').then(r => r.json()).then(d => {
  DATA = d; pts = d.points;
  buildBuffers();
  resize();
  if (location.hash === '#2d') { dim = dimTgt = 0; document.getElementById('dimchip').textContent = '2d'; }
  setView(location.hash === '#content' ? 'content' : 'all');
  morph = morphTgt;
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
