<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytk tags</title>
<style>
  :root { color-scheme: dark; }
  * { font-size: 14px; }
  body { font-family: system-ui; background: #111; color: #eee; margin: 0; }
  header { display: flex; gap: 1rem; align-items: center; padding: .8rem 1rem; background: #181818; position: sticky; top: 0; z-index: 5; }
  header a { color: #e2b04a; text-decoration: none; font-weight: 600; }
  header a.here { color: #4ade80; }
  header .count { color: #888; margin-left: auto; }

  main { max-width: 760px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }
  #status { color: #888; min-height: 1.2rem; }
  #status .fail { color: #f87171; }
  .btn { background: #2a2a2a; color: #eee; border: 0; border-radius: 8px; padding: .55rem 1rem; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn:hover { background: #333; }
  .btn.primary { background: #e2b04a; color: #241a05; }
  .btn.primary:disabled { background: #2a2a2a; color: #666; cursor: default; }

  .group { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 10px; padding: .8rem .9rem; display: flex; flex-direction: column; gap: .6rem; }
  .group.skipped { opacity: .4; }
  .grouprow { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: .35rem; background: #262626; color: #ddd; border: 1px solid #333; border-radius: 999px; padding: .3rem .8rem; cursor: pointer; font-family: inherit; user-select: none; }
  .chip .n { color: #888; }
  .chip.canonical { background: #e2b04a; border-color: #e2b04a; color: #241a05; font-weight: 600; }
  .chip.canonical .n { color: #14532d; }
  .chip.excluded { opacity: .35; text-decoration: line-through; }
  .chip .x { color: #888; padding-left: .15rem; }
  .chip.canonical .x { display: none; }
  .hint { color: #666; }
  .gbtns { display: flex; gap: .4rem; }
  .gbtn { background: #262626; color: #bbb; border: 1px solid #333; border-radius: 8px; padding: .3rem .8rem; cursor: pointer; font-family: inherit; }
  .gbtn.on { background: #e2b04a; border-color: #e2b04a; color: #241a05; font-weight: 600; }

  #applybar { position: sticky; bottom: 0; background: #181818; padding: .8rem 1rem; display: flex; gap: 1rem; align-items: center; border-top: 1px solid #2a2a2a; }
  #summary { color: #888; }
</style>
<link rel="stylesheet" href="/static/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='10' cy='20' r='4' fill='%235b7cfa'/%3E%3Ccircle cx='21' cy='10' r='3' fill='%23d9a520'/%3E%3Ccircle cx='23' cy='22' r='2.4' fill='%23e0507e'/%3E%3C/svg%3E">
</head>
<body>
<header>
  <a href="/">fresh</a>
  <a href="/inbox">inbox</a>
  <a href="/tags" class="here">tags</a>
<a href="/map">map</a>
  <span class="count" id="count"></span>
</header>

<main>
  <div class="grouprow">
    <button id="propose" class="btn primary">Find merge candidates</button>
    <span id="status"></span>
  </div>
  <span class="hint">Click a tag to make it the canonical name. Click × to keep a tag out of the merge. Nothing changes until Apply.</span>
  <div id="groups"></div>
</main>

<div id="applybar" hidden>
  <button id="apply" class="btn primary">Apply</button>
  <span id="summary"></span>
</div>

<script>
let groups = [];  // {canonical, variants[], counts{}, excluded:Set, accepted:bool}
let pollTimer = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function mappingFromState() {
  const m = {};
  for (const g of groups) {
    if (!g.accepted) continue;
    for (const t of [g.canonical, ...g.variants]) {
      if (t !== g.canonical && !g.excluded.has(t)) m[t] = g.canonical;
    }
  }
  return m;
}

function render() {
  const el = document.getElementById("groups");
  el.innerHTML = groups.map((g, gi) => {
    const all = [g.canonical, ...g.variants];
    const chips = all.map(t => {
      const cls = t === g.canonical ? "canonical" : g.excluded.has(t) ? "excluded" : "";
      return `<span class="chip ${cls}" data-g="${gi}" data-t="${esc(t)}">
        ${esc(t)} <span class="n">${g.counts[t] ?? ""}</span><span class="x" data-x="1">&times;</span></span>`;
    }).join("");
    return `<div class="group${g.accepted ? "" : " skipped"}">
      <div class="grouprow">
        <div class="chips">${chips}</div>
        <div class="gbtns">
          <button class="gbtn${g.accepted ? " on" : ""}" data-acc="${gi}">merge</button>
          <button class="gbtn${g.accepted ? "" : " on"}" data-skip="${gi}">skip</button>
        </div>
      </div>
    </div>`;
  }).join("");

  el.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", ev => {
      const g = groups[+chip.dataset.g], t = chip.dataset.t;
      if (ev.target.dataset.x) {           // toggle exclusion
        if (t !== g.canonical) g.excluded.has(t) ? g.excluded.delete(t) : g.excluded.add(t);
      } else if (t !== g.canonical) {      // re-pick canonical
        g.variants = [g.canonical, ...g.variants].filter(x => x !== t);
        g.canonical = t;
        g.excluded.delete(t);
      }
      render();
    });
  });
  el.querySelectorAll("[data-acc]").forEach(b =>
    b.addEventListener("click", () => { groups[+b.dataset.acc].accepted = true; render(); }));
  el.querySelectorAll("[data-skip]").forEach(b =>
    b.addEventListener("click", () => { groups[+b.dataset.skip].accepted = false; render(); }));

  const m = mappingFromState();
  const n = Object.keys(m).length;
  document.getElementById("applybar").hidden = groups.length === 0;
  document.getElementById("apply").disabled = n === 0;
  document.getElementById("summary").textContent =
    n ? `${n} tags will be retired into ${new Set(Object.values(m)).size} canonical tags` : "no merges selected";
  document.getElementById("count").textContent = groups.length ? `${groups.length} proposals` : "";
}

async function pollStatus() {
  const s = await (await fetch("/api/tags/merge/status")).json();
  const st = document.getElementById("status");
  if (s.state === "running") { st.textContent = "clustering + refining with haiku..."; return; }
  clearInterval(pollTimer); pollTimer = null;
  document.getElementById("propose").disabled = false;
  if (s.state === "error") { st.innerHTML = `<span class="fail">${esc(s.detail)}</span>`; return; }
  st.textContent = s.proposals.length ? "" : "no merge candidates found — vocabulary is clean";
  groups = s.proposals.map(p => ({ ...p, excluded: new Set(), accepted: true }));
  render();
}

document.getElementById("propose").addEventListener("click", async () => {
  document.getElementById("propose").disabled = true;
  await fetch("/api/tags/merge/propose", { method: "POST" });
  pollTimer = setInterval(pollStatus, 1500);
});

document.getElementById("apply").addEventListener("click", async () => {
  const mapping = mappingFromState();
  document.getElementById("apply").disabled = true;
  const res = await fetch("/api/tags/merge/apply", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ mapping }),
  });
  const out = await res.json();
  groups = [];
  render();
  document.getElementById("status").textContent =
    `applied: ${out.aliases} aliases saved, ${out.notes} notes rewritten, ${out.videos} index entries updated`;
});
</script>
</body>
</html>
