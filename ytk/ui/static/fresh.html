<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytk fresh</title>
<style>
  :root { color-scheme: dark; }
  * { font-size: 14px; }
  body { font-family: system-ui; background: #111; color: #eee; margin: 0; }
  header { display: flex; gap: 1rem; align-items: center; padding: .8rem 1rem; background: #181818; position: sticky; top: 0; z-index: 5; }
  header a { color: #e2b04a; text-decoration: none; font-weight: 600; }
  header a.here { color: #4ade80; }
  #filters { display: flex; gap: .35rem; margin-left: .5rem; }
  .fchip { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 999px; padding: .2rem .7rem; cursor: pointer; font-family: inherit; }
  .fchip.on { background: #e2b04a; border-color: #e2b04a; color: #000; font-weight: 600; }
  header .hint { color: #888; margin-left: auto; }
  #wrap { padding: 1rem; }
  main#fresh { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); grid-auto-rows: 8px; grid-auto-flow: row dense; gap: .75rem; }
  .card { position: relative; background: #1c1c1c; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .card img { width: 100%; display: block; }
  .skel { background: #1c1c1c; border-radius: 10px; animation: pulse 1.4s ease-in-out infinite; }
  .empty { grid-column: 1 / -1; color: #888; padding: 2rem 0; text-align: center; }
  @keyframes pulse { 50% { opacity: .5; } }
  .noimg { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; color: #777; }
  .badge { position: absolute; top: .45rem; right: .45rem; background: #000b; border-radius: 999px; width: 1.7rem; height: 1.7rem; display: flex; align-items: center; justify-content: center; }
  .badge svg { width: 1rem; height: 1rem; }
  .take { position: absolute; top: .55rem; left: 2.3rem; width: .7rem; height: .7rem; border-radius: 999px; background: #4ade80; }
  .del { position: absolute; top: .45rem; left: .45rem; z-index: 3; width: 1.7rem; height: 1.7rem; border: 0; border-radius: 999px; background: #000b; color: #fff; font-size: 1.1rem; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .12s; display: flex; align-items: center; justify-content: center; }
  .card:hover .del { opacity: 1; }
  .del:hover { background: #dc2626; }
  .memocard { padding: .8rem .8rem .2rem; background: linear-gradient(160deg, #13291f, #0d1c14); }
  .memocard p { margin: 0; color: #dcefe2; line-height: 1.4; font-size: .82rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  .memokind { color: #4ade80; font-size: .68rem; font-weight: 600; margin-bottom: .35rem; }
  .wave { width: 100%; height: 48px; display: block; margin-top: .55rem; cursor: pointer; }
  .meta { padding: .5rem .6rem .6rem; }
  .title { line-height: 1.3; max-height: 3.6em; overflow: hidden; }
  .tags { margin-top: .35rem; color: #e2b04a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { display: flex; gap: .5rem; margin-top: .3rem; color: #888; }
  .sub a { color: #e2b04a; text-decoration: none; margin-left: auto; }
  #viewer { position: fixed; inset: 0; background: #000d; display: none; padding: 2rem; z-index: 10; }
  #viewer.on { display: block; }
#similar { display: flex; gap: 8px; align-items: center; margin-top: 10px; overflow-x: auto; }
#similar img { height: 88px; border-radius: 6px; display: block; }
.sim-label { color: #888; font-size: 12px; flex-shrink: 0; }
  #viewer pre { background: #181818; color: #ddd; border-radius: 8px; height: 100%; margin: 0; padding: 1.2rem; overflow: auto; white-space: pre-wrap; font-family: inherit; }
  #close { position: absolute; top: 2.6rem; right: 2.8rem; background: #333; color: #eee; border: 0; border-radius: 8px; padding: .35rem .9rem; cursor: pointer; font-family: inherit; }
</style>
<link rel="stylesheet" href="/static/theme.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header>
  <a href="/" class="here">fresh</a>
  <a href="/inbox">inbox</a>
<a href="/tags">tags</a>
<a href="/map">map</a>
<a href="/settings">settings</a>
  <span id="filters"></span>
  <span class="hint" id="hint">recently ingested</span>
</header>

<div id="wrap"><main id="fresh"></main></div>

<div id="viewer"><button id="close">close</button><pre id="note"></pre><div id="similar"></div></div>

<script>
const ICONS = {
  instagram: '<svg viewBox="0 0 24 24" fill="#e1306c"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5zM17.6 5.4a1 1 0 1 1-1 1 1 1 0 0 1 1-1z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="#25f4ee"><path d="M16.5 3a4.8 4.8 0 0 0 3.6 3.5V9a7.9 7.9 0 0 1-3.7-1.1v5.7a5.6 5.6 0 1 1-5.6-5.6 5 5 0 0 1 .8.06v2.6a3 3 0 1 0 2.2 2.94V3h2.7z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="#ff0000"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26.3 26.3 0 0 0 2 12a26.3 26.3 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26.3 26.3 0 0 0 22 12a26.3 26.3 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></svg>',
  pinterest: '<svg viewBox="0 0 24 24" fill="#e60023"><path d="M12 2a10 10 0 0 0-3.6 19.3c-.1-.8-.2-2 .04-2.9l1.2-5s-.3-.6-.3-1.5c0-1.4.8-2.4 1.8-2.4.9 0 1.3.6 1.3 1.4 0 .9-.6 2.2-.9 3.4-.2 1 .5 1.9 1.5 1.9 1.9 0 3.3-2 3.3-4.8 0-2.5-1.8-4.3-4.4-4.3a4.6 4.6 0 0 0-4.8 4.6c0 .9.4 1.9.8 2.4a.3.3 0 0 1 .07.3l-.3 1.2c-.05.2-.2.25-.4.15-1.3-.6-2.1-2.5-2.1-4.1 0-3.3 2.4-6.4 7-6.4 3.7 0 6.5 2.6 6.5 6.1 0 3.7-2.3 6.6-5.5 6.6-1.1 0-2.1-.6-2.4-1.2l-.7 2.5c-.2.9-.9 2-1.3 2.7A10 10 0 1 0 12 2z"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="#9ca3af"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm7.9 9h-3a15.6 15.6 0 0 0-1.2-5.2A8 8 0 0 1 19.9 11zM12 4a13.8 13.8 0 0 1 1.9 7h-3.8A13.8 13.8 0 0 1 12 4zM8.3 5.8A15.6 15.6 0 0 0 7.1 11h-3a8 8 0 0 1 4.2-5.2zM4.1 13h3a15.6 15.6 0 0 0 1.2 5.2A8 8 0 0 1 4.1 13zM12 20a13.8 13.8 0 0 1-1.9-7h3.8A13.8 13.8 0 0 1 12 20zm3.7-1.8a15.6 15.6 0 0 0 1.2-5.2h3a8 8 0 0 1-4.2 5.2z"/></svg>',
  memo: '<svg viewBox="0 0 24 24" fill="#4ade80"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11h-2z"/></svg>',
};
const ICON_ALIASES = { "instagram-reel": "instagram", "journal": "web" };

let notes = [];
let sourceFilter = "";
const SOURCES = ["instagram", "youtube", "pinterest", "tiktok", "web", "memo"];

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

function renderFilters() {
  document.getElementById("filters").innerHTML = SOURCES.map(sname =>
    `<button class="fchip${sourceFilter === sname ? " on" : ""}" data-s="${sname}">${sname}</button>`).join("");
  document.querySelectorAll(".fchip").forEach(chip => {
    chip.addEventListener("click", () => {
      sourceFilter = sourceFilter === chip.dataset.s ? "" : chip.dataset.s;
      renderFilters();
      render();
    });
  });
}

async function openNote(path) {
  const res = await fetch("/api/note?path=" + encodeURIComponent(path));
  if (!res.ok) return;
  document.getElementById("note").textContent = (await res.json()).content;
  document.getElementById("viewer").classList.add("on");
  loadSimilar(path);
}

async function loadSimilar(path) {
  const box = document.getElementById("similar");
  box.innerHTML = "";
  const res = await fetch("/api/similar?n=8&note=" + encodeURIComponent(path));
  if (!res.ok) return;
  const items = await res.json();
  if (!items.length) return;
  box.innerHTML = "<span class='sim-label'>visually similar</span>" + items.map(r =>
    `<a href="${esc(r.url || "#")}" target="_blank" title="${esc(r.title || r.item_id)}">` +
    `<img src="/api/visual-image?id=${encodeURIComponent(r.item_id)}" loading="lazy"></a>`
  ).join("");
}

document.getElementById("close").addEventListener("click", () =>
  document.getElementById("viewer").classList.remove("on"));
document.getElementById("viewer").addEventListener("click", e => {
  if (e.target.id === "viewer")
    document.getElementById("viewer").classList.remove("on");
});

// Masonry row-span sizing. Dirty cards are collected and measured in a single
// rAF-coalesced pass that reads every scrollHeight before writing any style, so
// initial render, image loads, and resize collapse into one reflow per frame.
const rowH = 8, gap = 12;
let _dirty = new Set(), _raf = 0;
function relayout(cards) {
  for (const c of cards) _dirty.add(c);
  if (_raf) return;
  _raf = requestAnimationFrame(() => {
    _raf = 0;
    const batch = [..._dirty]; _dirty.clear();
    const spans = batch.map(c => Math.ceil((c.scrollHeight + gap) / (rowH + gap)));
    batch.forEach((c, i) => { c.style.gridRowEnd = "span " + spans[i]; });
  });
}

const SKEL_SPANS = [22, 30, 18, 26, 34, 20];
function showSkeletons() {
  document.getElementById("fresh").innerHTML = Array.from({ length: 12 }, (_, i) =>
    `<div class="skel" style="grid-row-end: span ${SKEL_SPANS[i % SKEL_SPANS.length]}"></div>`).join("");
}

function render() {
  const visible = sourceFilter
    ? notes.filter(n => (ICON_ALIASES[n.source] || n.source) === sourceFilter || n.channel === sourceFilter)
    : notes;
  document.getElementById("hint").textContent =
    `${visible.length} recently ingested`;
  if (!visible.length) {
    document.getElementById("fresh").innerHTML =
      `<div class="empty">nothing ingested yet</div>`;
    return;
  }
  const body = n => n.source === "memo"
    ? `<div class="memocard">
         <div class="memokind">${esc(n.kind || "memo")}${n.date ? " · " + esc(n.date) : ""}</div>
         <p>${esc(n.preview || n.title)}</p>
         ${n.audio ? `<canvas class="wave" data-audio="${esc(n.audio)}" title="play"></canvas>` : ""}
       </div>`
    : (n.thumbnail
        ? `<img src="/vault-media/${esc(n.thumbnail)}" loading="lazy">`
        : `<div class="noimg">${esc(n.source)}</div>`);
  document.getElementById("fresh").innerHTML = visible.map(n => `
    <div class="card" data-path="${esc(n.path)}">
      <button class="del" title="delete note" aria-label="delete note">&times;</button>
      <span class="badge">${ICONS[ICON_ALIASES[n.source] || n.source] || ICONS.web}</span>
      ${n.has_take ? '<span class="take" title="has a take"></span>' : ""}
      ${body(n)}
      ${n.source === "memo" ? "" : `<div class="meta">
        <div class="title">${esc(n.title)}</div>
        ${n.tags && n.tags.length ? `<div class="tags">${esc(n.tags.map(t => "#" + t).join(" "))}</div>` : ""}
        <div class="sub">
          ${n.url ? `<a href="${esc(n.url)}" target="_blank">open</a>` : ""}
        </div>
      </div>`}
    </div>`).join("");
  const cards = document.querySelectorAll("#fresh .card");
  cards.forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest("a") || e.target.closest(".wave") || e.target.closest(".del")) return;
      openNote(card.dataset.path);
    });
    const del = card.querySelector(".del");
    if (del) del.addEventListener("click", e => {
      e.stopPropagation();
      deleteCard(card.dataset.path);
    });
    const img = card.querySelector("img");
    if (img) img.addEventListener("load", () => relayout([card]));
  });
  relayout(cards);
  document.querySelectorAll("#fresh .wave").forEach(initWave);
}

async function deleteCard(path) {
  if (!confirm("Delete this note for good? It leaves the vault and the search index.")) return;
  const res = await fetch("/api/note/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path }),
  });
  if (!res.ok) { alert("Delete failed: " + (await res.text())); return; }
  notes = notes.filter(n => n.path !== path);
  render();
}

// --- memo waveforms: decoded client-side, one shared player at a time ---
let player = null, playingCv = null;

function drawWave(cv, frac) {
  const c = cv.getContext("2d");
  const W = cv.width = cv.offsetWidth * 2, H = cv.height = 96;
  const peaks = cv._peaks || [];
  const bw = W / peaks.length;
  c.clearRect(0, 0, W, H);
  peaks.forEach((p, i) => {
    c.fillStyle = i / peaks.length < frac ? "#4ade80" : "#31543f";
    const h = Math.max(4, p * H * 0.92);
    c.fillRect(i * bw + bw * 0.18, (H - h) / 2, bw * 0.64, h);
  });
}

async function initWave(cv) {
  try {
    const buf = await (await fetch("/api/memo-audio/" + encodeURIComponent(cv.dataset.audio))).arrayBuffer();
    const audio = await new (window.AudioContext || window.webkitAudioContext)().decodeAudioData(buf);
    const data = audio.getChannelData(0);
    const bars = 56, step = Math.floor(data.length / bars) || 1;
    cv._peaks = Array.from({ length: bars }, (_, i) => {
      let m = 0;
      for (let j = i * step; j < (i + 1) * step; j += 32) m = Math.max(m, Math.abs(data[j] || 0));
      return m;
    });
    drawWave(cv, 0);
    cv.addEventListener("click", e => {
      const frac = e.offsetX / cv.offsetWidth;
      if (playingCv === cv && player) {           // same memo: seek, or pause on replay
        player.currentTime = frac * player.duration;
        if (player.paused) player.play();
        return;
      }
      if (player) { player.pause(); if (playingCv) drawWave(playingCv, 0); }
      player = new Audio("/api/memo-audio/" + encodeURIComponent(cv.dataset.audio));
      playingCv = cv;
      player.addEventListener("timeupdate", () => drawWave(cv, player.currentTime / player.duration));
      player.addEventListener("ended", () => { drawWave(cv, 0); playingCv = null; });
      player.play();
    });
  } catch (e) { cv.remove(); }  // undecodable/missing audio: text-only card
}

window.addEventListener("resize", () =>
  relayout(document.querySelectorAll("#fresh .card")));

async function load() {
  notes = await (await fetch("/api/fresh?n=60")).json();
  render();
}
renderFilters();
showSkeletons();
load();
</script>
</body>
</html>
