<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytk inbox</title>
<style>
  :root { color-scheme: dark; }
  * { font-size: 14px; }
  body { font-family: system-ui; background: #111; color: #eee; margin: 0; }
  header { display: flex; gap: 1rem; align-items: center; padding: .8rem 1rem; background: #181818; position: sticky; top: 0; z-index: 5; }
  header a { color: #e2b04a; text-decoration: none; font-weight: 600; }
  header a.here { color: #4ade80; }
  header .count { color: #888; margin-left: auto; }
  #filters { display: flex; gap: .35rem; margin-left: .5rem; }
  .fchip { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 999px; padding: .2rem .7rem; cursor: pointer; font-family: inherit; }
  .fchip.on { background: #e2b04a; border-color: #e2b04a; color: #000; font-weight: 600; }

  #layout { display: flex; align-items: flex-start; }
  #gridwrap { flex: 1; padding: 1rem; }
  main#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); grid-auto-rows: 8px; grid-auto-flow: row dense; gap: .75rem; }
  .card { position: relative; background: #1c1c1c; border-radius: 10px; overflow: hidden; cursor: pointer; outline: 3px solid transparent; }
  .card.wide { grid-column: span 2; }
  .card.sel { outline-color: #4ade80; }
  .card img { width: 100%; aspect-ratio: 9/16; object-fit: cover; display: block; }
  .card.wide img { aspect-ratio: 16/9; }
  .noimg { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; color: #777; }
  .badge { position: absolute; top: .45rem; right: .45rem; background: #000b; border-radius: 999px; width: 1.7rem; height: 1.7rem; display: flex; align-items: center; justify-content: center; }
  .badge svg { width: 1rem; height: 1rem; }
  .check { position: absolute; top: .45rem; left: .45rem; background: #4ade80; color: #000; border-radius: 999px; width: 1.7rem; height: 1.7rem; display: none; align-items: center; justify-content: center; font-weight: 700; }
  .card.sel .check { display: flex; }
  .card.queued { outline-color: #e2b04a55; }
  .card.queued img, .card.ingesting img { opacity: .45; }
  .card.ingesting { outline-color: #e2b04a; }
  .spinner { position: absolute; top: 50%; left: 50%; width: 2rem; height: 2rem; margin: -1rem 0 0 -1rem; border: 3px solid #e2b04a33; border-top-color: #e2b04a; border-radius: 50%; animation: spin .8s linear infinite; display: none; }
  .card.ingesting .spinner { display: block; }
  .qbadge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #000b; color: #e2b04a; border-radius: 999px; padding: .2rem .8rem; display: none; }
  .card.queued .qbadge { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ctitle { padding: .4rem .6rem .5rem; color: #ccc; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .openlink { position: absolute; bottom: .45rem; right: .45rem; background: #000b; color: #e2b04a; text-decoration: none; border-radius: 999px; padding: .15rem .7rem; opacity: 0; transition: opacity .15s; }
  .card:hover .openlink { opacity: 1; }

  aside#side { width: 300px; position: sticky; top: 3.4rem; padding: 1rem; display: flex; flex-direction: column; gap: .8rem; max-height: calc(100vh - 3.4rem); overflow-y: auto; }
  aside#side h2 { font-weight: 600; color: #999; margin: 0; }
  #addurls, #thought { width: 100%; box-sizing: border-box; background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 8px; padding: .55rem .7rem; resize: vertical; font-family: inherit; }
  #addurls { min-height: 2.2rem; }
  #thought { min-height: 9rem; }
  .btn { background: #2a2a2a; color: #eee; border: 0; border-radius: 8px; padding: .55rem 1rem; cursor: pointer; font-family: inherit; font-weight: 600; }
  .btn:hover { background: #333; }
  .btn.primary { background: #e2b04a; color: #241a05; }
  .btn.primary:disabled { background: #2a2a2a; color: #666; cursor: default; }
  #chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip { background: #262626; color: #ddd; border: 1px solid #333; border-radius: 999px; padding: .3rem .8rem; cursor: pointer; font-family: inherit; }
  .chip.on { background: #e2b04a; border-color: #e2b04a; color: #241a05; font-weight: 600; }
  #newtagrow { display: flex; gap: .4rem; }
  #newtag { flex: 1; background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 999px; padding: .3rem .8rem; font-family: inherit; }
  #selcount { color: #bbb; }
  #pullmsg, #progress { color: #888; min-height: 1.1rem; }
  #qbar { display: none; height: 8px; border-radius: 999px; overflow: hidden; background: #262626; }
  #qbar.on { display: flex; }
  #qbar div { height: 100%; transition: flex-grow .6s ease; }
  #qbar .failed { background: #f87171; }
  #qbar .active { background: #e2b04a; animation: pulse 1.2s ease-in-out infinite; }
  #qbar .waiting { background: #e2b04a44; }
  @keyframes pulse { 50% { opacity: .5; } }
  #progress .fail, #pullmsg .fail { color: #f87171; }
</style>
<link rel="stylesheet" href="/static/theme.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header>
  <a href="/">fresh</a>
  <a href="/inbox" class="here">inbox</a>
  <a href="/tags">tags</a>
<a href="/map">map</a>
<a href="/settings">settings</a>
  <span id="filters"></span>
  <span class="count" id="count"></span>
</header>

<div id="layout">
  <div id="gridwrap"><main id="grid"></main></div>

  <aside id="side">
    <div id="pullmsg"></div>
    <h2>Add to queue</h2>
    <textarea id="addurls" rows="2"></textarea>
    <button id="addbtn" class="btn">Add</button>

    <h2>Ingest</h2>
    <span id="selcount">0 selected</span>
    <span id="tags"><span id="chips"></span></span>
    <div id="newtagrow">
      <input id="newtag" placeholder="new tag">
      <button id="newtagbtn" class="btn">Create</button>
    </div>
    <textarea id="thought"></textarea>
    <button id="ingest" class="btn primary" disabled>Ingest</button>
    <div id="qbar"></div>
    <div id="progress"></div>
  </aside>
</div>

<script>
const ICONS = {
  instagram: '<svg viewBox="0 0 24 24" fill="#e1306c"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5zM17.6 5.4a1 1 0 1 1-1 1 1 1 0 0 1 1-1z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="#25f4ee"><path d="M16.5 3a4.8 4.8 0 0 0 3.6 3.5V9a7.9 7.9 0 0 1-3.7-1.1v5.7a5.6 5.6 0 1 1-5.6-5.6 5 5 0 0 1 .8.06v2.6a3 3 0 1 0 2.2 2.94V3h2.7z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="#ff0000"><path d="M21.6 7.2a2.5 2.5 0 0 0-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.5 2.5 0 0 0 2.4 7.2 26.3 26.3 0 0 0 2 12a26.3 26.3 0 0 0 .4 4.8 2.5 2.5 0 0 0 1.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.5 2.5 0 0 0 1.8-1.8A26.3 26.3 0 0 0 22 12a26.3 26.3 0 0 0-.4-4.8zM10 15V9l5.2 3z"/></svg>',
  pinterest: '<svg viewBox="0 0 24 24" fill="#e60023"><path d="M12 2a10 10 0 0 0-3.6 19.3c-.1-.8-.2-2 .04-2.9l1.2-5s-.3-.6-.3-1.5c0-1.4.8-2.4 1.8-2.4.9 0 1.3.6 1.3 1.4 0 .9-.6 2.2-.9 3.4-.2 1 .5 1.9 1.5 1.9 1.9 0 3.3-2 3.3-4.8 0-2.5-1.8-4.3-4.4-4.3a4.6 4.6 0 0 0-4.8 4.6c0 .9.4 1.9.8 2.4a.3.3 0 0 1 .07.3l-.3 1.2c-.05.2-.2.25-.4.15-1.3-.6-2.1-2.5-2.1-4.1 0-3.3 2.4-6.4 7-6.4 3.7 0 6.5 2.6 6.5 6.1 0 3.7-2.3 6.6-5.5 6.6-1.1 0-2.1-.6-2.4-1.2l-.7 2.5c-.2.9-.9 2-1.3 2.7A10 10 0 1 0 12 2z"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="#9ca3af"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm7.9 9h-3a15.6 15.6 0 0 0-1.2-5.2A8 8 0 0 1 19.9 11zM12 4a13.8 13.8 0 0 1 1.9 7h-3.8A13.8 13.8 0 0 1 12 4zM8.3 5.8A15.6 15.6 0 0 0 7.1 11h-3a8 8 0 0 1 4.2-5.2zM4.1 13h3a15.6 15.6 0 0 0 1.2 5.2A8 8 0 0 1 4.1 13zM12 20a13.8 13.8 0 0 1-1.9-7h3.8A13.8 13.8 0 0 1 12 20zm3.7-1.8a15.6 15.6 0 0 0 1.2-5.2h3a8 8 0 0 1-4.2 5.2z"/></svg>',
};

const sel = new Set();          // selected item URLs
let items = [];
let jobState = { queued: [], current: null };
const tags = new Set();
let sourceFilter = "";
const SOURCES = ["instagram", "youtube", "pinterest", "tiktok", "web"];

function renderFilters() {
  document.getElementById("filters").innerHTML = SOURCES.map(sname =>
    `<button class="fchip${sourceFilter === sname ? " on" : ""}" data-s="${sname}">${sname}</button>`).join("");
  document.querySelectorAll(".fchip").forEach(chip => {
    chip.addEventListener("click", () => {
      sourceFilter = sourceFilter === chip.dataset.s ? "" : chip.dataset.s;
      renderFilters();
      renderGrid();
    });
  });
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

function renderBar() {
  document.getElementById("selcount").textContent = sel.size + " selected";
  document.getElementById("ingest").disabled = sel.size === 0;
}

function renderChips(all) {
  document.getElementById("chips").innerHTML = all.map(t =>
    `<button class="chip${tags.has(t) ? " on" : ""}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const t = chip.dataset.t;
      if (tags.has(t)) { tags.delete(t); } else { tags.add(t); }
      chip.classList.toggle("on", tags.has(t));
    });
  });
}

async function loadTags() {
  const data = await (await fetch("/api/tags")).json();
  renderChips(data.tags);
}

document.getElementById("newtagbtn").addEventListener("click", async () => {
  const input = document.getElementById("newtag");
  const name = input.value.trim();
  if (!name) return;
  const res = await fetch("/api/tags", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });
  if (res.ok) {
    input.value = "";
    const data = await res.json();
    renderChips(data.tags);
  }
});

async function loadQueue() {
  const res = await fetch("/api/queue");
  items = (await res.json()).items;
  renderGrid();
}

function renderGrid() {
  const scrollY = window.scrollY;
  const visible = sourceFilter ? items.filter(i => i.source === sourceFilter) : items;
  document.getElementById("count").textContent =
    (sourceFilter ? `${visible.length} of ${items.length}` : items.length) + " pending";
  const qorder = new Map((jobState.queued || []).map((u, i) => [u, i + 1]));
  const rank = it => it.url === jobState.current ? 0 : (qorder.get(it.url) ?? Infinity);
  const sorted = [...visible].sort((a, b) =>
    rank(a) - rank(b)
    || (b.shared_at || "").localeCompare(a.shared_at || "") || b.n - a.n);
  document.getElementById("grid").innerHTML = sorted.map(it => `
    <div class="card${sel.has(it.url) ? " sel" : ""}${it.source === "youtube" ? " wide" : ""}" data-url="${esc(it.url)}">
      <span class="check">ok</span>
      <span class="badge">${ICONS[it.source] || ICONS.web}</span>
      ${it.preview_url
        ? `<img src="/api/cover?u=${encodeURIComponent(it.url)}" loading="lazy"
             onerror="this.onerror=null;this.src='${esc(it.preview_url)}'">`
        : `<div class="noimg">${esc(it.source)}</div>`}
      <div class="spinner"></div>
      <span class="qbadge">queued</span>
      ${it.source === "youtube" && it.author ? `<div class="ctitle">${esc(it.author)}</div>` : ""}
      <a class="openlink" href="${esc(it.url)}" target="_blank">open</a>
    </div>`).join("");
  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", e => {
      if (e.target.closest("a")) return;
      if (card.classList.contains("queued") || card.classList.contains("ingesting")) return;
      const u = card.dataset.url;
      if (sel.has(u)) { sel.delete(u); } else { sel.add(u); }
      card.classList.toggle("sel");
      renderBar();
    });
  });
  layoutGrid();
  paintJobState();
  renderBar();
  window.scrollTo(0, scrollY);
}

let lastOrderKey = "";

function paintJobState() {
  const order = jobState.queued || [];
  const pos = new Map(order.map((u, i) => [u, i + 1]));
  document.querySelectorAll(".card").forEach(card => {
    const u = card.dataset.url;
    card.classList.toggle("ingesting", u === jobState.current);
    card.classList.toggle("queued", pos.has(u));
    if (pos.has(u)) card.querySelector(".qbadge").textContent = "#" + pos.get(u);
  });
  const key = jobState.current + "|" + order.join(",");
  if (key !== lastOrderKey) {
    lastOrderKey = key;
    renderGrid();   // safe: key now matches, so this does not recurse
  }
}

function layoutGrid() {
  const rowH = 8, gap = 12;
  const cards = [...document.querySelectorAll(".card")];
  if (!cards.length) return;
  const base = cards.find(c => !c.classList.contains("wide")) || cards[0];
  const w = base.getBoundingClientRect().width;
  const spanFor = h => "span " + Math.ceil((h + gap) / (rowH + gap));
  const bare = spanFor(200);
  cards.forEach(c => {
    const title = c.querySelector(".ctitle");
    const extra = title ? title.offsetHeight : 0;
    c.style.gridRowEnd = c.querySelector("img")
      ? (c.classList.contains("wide") ? spanFor((2 * w + gap) * 9 / 16 + extra) : spanFor(w * 16 / 9 + extra))
      : bare;
  });
}

window.addEventListener("resize", layoutGrid);

document.getElementById("addbtn").addEventListener("click", async () => {
  const box = document.getElementById("addurls");
  const urls = box.value.split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
  if (!urls.length) return;
  await fetch("/api/queue/add", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ urls }),
  });
  box.value = "";
  await loadQueue();
});

async function autoPull() {
  const msg = document.getElementById("pullmsg");
  try {
    const r = await (await fetch("/api/queue/refresh", { method: "POST" })).json();
    if (r.skipped) return;
    const errs = r.errors.length
      ? ` <span class="fail">${esc(r.errors.join("; "))}</span>` : "";
    if (r.instagram || r.youtube || r.errors.length) {
      msg.innerHTML = `pulled ${r.instagram} from Instagram, ${r.youtube} from the playlist${errs}`;
      await loadQueue();
    }
  } catch (e) {
    msg.innerHTML = `<span class="fail">source pull failed: ${esc(String(e))}</span>`;
  }
}

let pollTimer = null;
let lastDone = 0;

async function pollStatus() {
  const s = await (await fetch("/api/ingest/status")).json();
  const p = document.getElementById("progress");
  const fails = s.failures.length
    ? ` <span class="fail">${s.failures.length} failed</span>` : "";
  const linked = (s.linked || []).length
    ? `<br>${s.linked.map(esc).join("<br>")}` : "";
  jobState = { queued: s.queued || [], current: s.current };
  if (s.done !== lastDone) {
    lastDone = s.done;
    await loadQueue();   // completed items leave the grid as they finish
  }
  paintJobState();
  renderQbar(s);
  if (s.running) {
    p.innerHTML = `${fails}${linked}`;
  } else {
    clearInterval(pollTimer);
    pollTimer = null;
    p.innerHTML = (s.failures.length || (s.linked || []).length)
      ? `${fails}${linked}` : "";
    await loadQueue();
  }
}

function renderQbar(s) {
  const bar = document.getElementById("qbar");
  bar.classList.toggle("on", s.running);
  if (!s.running) { bar.innerHTML = ""; return; }
  const failed = s.failures.length;
  const active = s.current ? 1 : 0;
  const waiting = (s.queued || []).length;
  if (!bar.children.length) {
    bar.innerHTML = ["failed", "active", "waiting"]
      .map(cls => `<div class="${cls}"></div>`).join("");
  }
  [failed, active, waiting].forEach((n, i) => {
    const seg = bar.children[i];
    seg.style.flexGrow = n;
    seg.title = `${seg.className}: ${n}`;
  });
}

function startPolling() {
  if (!pollTimer) pollTimer = setInterval(pollStatus, 1500);
  pollStatus();
}

document.getElementById("ingest").addEventListener("click", async () => {
  const thought = document.getElementById("thought").value;
  const res = await fetch("/api/ingest", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ urls: [...sel], tags: [...tags], thought }),
  });
  if (!res.ok) {
    const err = await res.json();
    document.getElementById("progress").innerHTML =
      `<span class="fail">${esc(err.detail || res.status)}</span>`;
    return;
  }
  sel.clear();
  tags.clear();
  document.querySelectorAll(".chip.on").forEach(c => c.classList.remove("on"));
  renderGrid();
  document.getElementById("thought").value = "";
  startPolling();
});

renderFilters();
loadTags();
loadQueue().then(() => {
  // resync with any job already running (e.g. after a page reload mid-ingest)
  startPolling();
});
autoPull();
</script>
</body>
</html>
